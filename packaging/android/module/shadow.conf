# Loom Android sparse-shadow Alpha 2
#
# Default is disabled so installing Alpha 2 never replaces or interferes with
# the user's current mount module. Enable after choosing a payload source.
LOOM_SHADOW_ENABLED=0

# Optional: import regular files from another installed KernelSU/Magisk module.
# Example: LOOM_SOURCE_MODULE_ID=my_existing_module
# When set, Loom reads /data/adb/modules/<id>/system without modifying it.
LOOM_SOURCE_MODULE_ID=

# Used only when LOOM_SOURCE_MODULE_ID is empty.
LOOM_PAYLOAD_ROOT=/data/adb/loom/payload/system

LOOM_TARGET=system
LOOM_ORIGIN=auto
LOOM_DM_PREFIX=loom-shadow-system
LOOM_MOUNTPOINT=/data/adb/loom/mnt/system-shadow

# Alpha 2 uses a correctness-first layered transaction model. Every changed
# file becomes one Loom dm layer, and every failure rolls the whole chain back.
LOOM_MAX_LAYERS=32

# Hard safety gate. Alpha 2 never takes over /system. Values other than 0 are
# rejected by preflight rather than silently enabling a system mount takeover.
LOOM_TAKEOVER=0
