# Loom Android Alpha 3 block-generation composer
#
# The composer scans enabled ordinary KernelSU/Magisk modules, resolves their
# system/ payloads into one deterministic staging tree, and asks loom-shadow to
# compile that tree into a single effective block-view generation.
#
# This is intentionally enabled by default because it is sidecar-only: the
# resulting effective EROFS is mounted below /data/adb/loom/mnt and never over
# /system. Turning on first-stage takeover is a separate future bootstrap gate.
LOOM_COMPOSE_ENABLED=1

# Standard KernelSU/Magisk metadata/content root used by this first flashable
# generation. Modules with disable/remove/skip_mount are ignored. Loom itself
# and any active metamodule are excluded from the payload set.
LOOM_COMPOSE_MODULE_ROOT=/data/adb/modules

# Deterministic v1 conflict rule: modules are processed by ascending module id;
# when two modules provide the same pathname, the lexically later module wins.
LOOM_COMPOSE_ORDER=lexical-last-wins

# Alpha 3 still lowers each changed file through the proven layered dm-linear
# runtime, so cap the composed regular-file count to avoid pathological stacks.
# A future dm-loom target removes this per-file dm depth.
LOOM_COMPOSE_MAX_FILES=128

LOOM_TARGET=system
LOOM_ORIGIN=auto
LOOM_MOUNTPOINT=/data/adb/loom/mnt/system-generation

# Hard safety gate for this flashable development build. The composer may build
# and mount a complete effective block view, but it must not replace the Android
# first-stage /system source until the early bootstrap path is device-proven.
LOOM_TAKEOVER=0
