name: stage3-format

on:
  push:
    branches:
      - feat/stage3-ext4-block-allocation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/stage3-ext4-block-allocation

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt and commit
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-ext4/src/allocate.rs crates/loom-cli/src/main.rs crates/loom-ext4/src/lib.rs
          git commit -m 'style: apply rustfmt to Stage 3 allocator'
          git push origin HEAD:feat/stage3-ext4-block-allocation
