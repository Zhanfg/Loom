name: stage27-plain-diagnostic

on:
  push:
    branches:
      - feat/stage27-erofs-partial-tail
    paths:
      - .github/workflows/stage27-plain-diagnostic.yml

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Build exact Stage 27 ordinary image and dump extents
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$(mktemp -d)"
          ROOT="$WORK/root"
          IMG="$WORK/ordinary.erofs"
          mkdir -p "$ROOT"
          python3 -c 'from pathlib import Path; size=24*4096-123; data=bytearray(b"M"*size); data[64:64+28]=b"LOOM-STAGE27-ORDINARY-ORIG"; Path("'"$ROOT"'/000payload.bin").write_bytes(data)'
          for i in $(seq -w 0 499); do : > "$ROOT/z_dummy_${i}_for_directory_growth"; done
          mkfs.erofs -b 4096 -C 4096 -zlz4 -E noinline_data -T 0 --max-extent-bytes 32768 "$IMG" "$ROOT"
          fsck.erofs "$IMG"
          dump.erofs -e --path=/000payload.bin "$IMG"
