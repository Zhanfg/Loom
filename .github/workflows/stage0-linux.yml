          cli_text = cli_text.replace(
              '    compile_one_block_growth, compile_resize_within_allocation, compile_same_size_replacement,\n',
              '    compile_contiguous_growth, compile_one_block_growth, compile_resize_within_allocation,\n    compile_same_size_replacement,\n',
              1,
          )
          cli_text = cli_text.replace(
              '        "ext4-grow-one" => command_ext4_grow_one(&mut args)?,\n',
              '        "ext4-grow-one" => command_ext4_grow_one(&mut args)?,\n        "ext4-grow-run" => command_ext4_grow_run(&mut args)?,\n',
              1,
          )
          handler_marker = 'fn required(args: &mut impl Iterator<Item = String>, name: &str) -> Result<String, Box<dyn Error>> {'
          handler = r'''fn command_ext4_grow_run(args: &mut impl Iterator<Item = String>) -> Result<(), Box<dyn Error>> {
    let origin_image = required(args, "origin ext4 image")?;
    let target_path = required(args, "target path")?;
    let replacement = required(args, "replacement file")?;
    let shadow_output = required(args, "shadow pack output")?;
    let origin_device = required(args, "origin block device")?;
    let shadow_device = required(args, "shadow block device")?;
    let table_output = required(args, "dm table output")?;
    ensure_no_extra_args(args)?;

    let compiled = compile_contiguous_growth(
        Path::new(&origin_image),
        &target_path,
        Path::new(&replacement),
    )?;
    fs::write(&shadow_output, &compiled.shadow)?;
    let table = compiled
        .map
        .to_dm_linear_table(&origin_device, &shadow_device)?;
    fs::write(&table_output, table)?;

    println!(
        "ext4 contiguous growth compiled: inode={} allocated_block={} block_size={} original_data_blocks={} effective_data_blocks={} new_data_blocks={} existing_data_shadow_blocks={} inode_metadata_blocks={} allocator_metadata_blocks={} shadow_blocks={} shadow_bytes={}",
        compiled.inode,
        compiled.allocated_block,
        compiled.block_size,
        compiled.original_data_blocks,
        compiled.effective_data_blocks,
        compiled.new_data_blocks,
        compiled.existing_data_shadow_blocks,
        compiled.inode_metadata_blocks,
        compiled.allocator_metadata_blocks,
        compiled.shadow_blocks,
        compiled.shadow.len()
    );
    Ok(())
}

'''
          if 'fn command_ext4_grow_run(' not in cli_text:
