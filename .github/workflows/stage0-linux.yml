name: stage-linux

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-and-ext4-fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Stage 4 branch
        uses: actions/checkout@v5
        with:
          ref: feat/stage4-ext4-contiguous-growth

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs dmsetup util-linux
          sudo modprobe dm_mod
          sudo modprobe dm_linear || true

      - name: Generalize allocator growth policy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/loom-ext4/src/allocator.rs')
          text = path.read_text()

          def replace_span(source: str, start: str, end: str, replacement: str) -> str:
              start_index = source.index(start)
              end_index = source.index(end, start_index)
              return source[:start_index] + replacement + source[end_index:]

          marker = '''struct GroupDescriptorLocation {\n    group: u32,\n    descriptor_block: u64,\n    descriptor_offset: usize,\n    block_bitmap: u64,\n    free_blocks: u32,\n    flags: u16,\n}\n'''
          addition = '''\n#[derive(Debug, Clone, Copy)]\nenum GrowthPolicy {\n    ExactlyOne,\n    UpTo64,\n}\n\nimpl GrowthPolicy {\n    fn validate(self, new_blocks: usize) -> Result<(), Ext4Error> {\n        match self {\n            Self::ExactlyOne if new_blocks != 1 => Err(Ext4Error::UnsupportedFilesystemFeature(\n                "Stage 3 allocator requires exactly one new data block",\n            )),\n            Self::UpTo64 if new_blocks == 0 || new_blocks > 64 => {\n                Err(Ext4Error::UnsupportedFilesystemFeature(\n                    "Stage 4 allocator supports at most 64 new data blocks and requires at least one",\n                ))\n            }\n            _ => Ok(()),\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy)]\nstruct AllocatorDelta {\n    geometry: AllocationGeometry,\n    allocated_blocks: u32,\n}\n'''
          if 'enum GrowthPolicy' not in text:
              if marker not in text:
                  raise SystemExit('group descriptor insertion marker missing')
              text = text.replace(marker, marker + addition, 1)

          old_plan = '''struct InodeGrowthPlan<'a> {\n    inode_number: u32,\n    inode: &'a Inode,\n    old_block: u64,\n    new_block: u64,\n    checksum_seed: u32,\n    sectors_per_block: u64,\n    effective_size: u64,\n}\n'''
          new_plan = '''struct InodeGrowthPlan<'a> {\n    inode_number: u32,\n    inode: &'a Inode,\n    old_block: u64,\n    new_run_start: u64,\n    new_block_count: usize,\n    checksum_seed: u32,\n    sectors_per_block: u64,\n    added_sectors: u64,\n    effective_size: u64,\n}\n'''
          if new_plan not in text:
              if old_plan not in text:
                  raise SystemExit('InodeGrowthPlan shape missing')
              text = text.replace(old_plan, new_plan, 1)

          public_and_compile = r'''/// Grows a one-block ext4 regular file by exactly one newly allocated data block.
///
/// # Errors
/// Returns [`Ext4Error`] when the target or filesystem falls outside the proven
/// allocator subset or exactly one new block cannot be allocated safely.
pub fn compile_one_block_growth(
    origin_path: &Path,
    target_path: &str,
    replacement_path: &Path,
) -> Result<CompiledGrowth, Ext4Error> {
    compile_growth_from_path(
        origin_path,
        target_path,
        replacement_path,
        GrowthPolicy::ExactlyOne,
    )
}

/// Grows a one-block ext4 regular file by a bounded contiguous free-block run.
///
/// Stage 4 accepts between one and 64 new blocks, all allocated contiguously in
/// the existing data block's block group. Existing source data stays stock.
///
/// # Errors
/// Returns [`Ext4Error`] when the target or filesystem falls outside the proven
/// allocator subset, the request is not block aligned/bounded, or no suitable
/// contiguous run can be allocated safely.
pub fn compile_contiguous_growth(
    origin_path: &Path,
    target_path: &str,
    replacement_path: &Path,
) -> Result<CompiledGrowth, Ext4Error> {
    compile_growth_from_path(
        origin_path,
        target_path,
        replacement_path,
        GrowthPolicy::UpTo64,
    )
}

fn compile_growth_from_path(
    origin_path: &Path,
    target_path: &str,
    replacement_path: &Path,
    policy: GrowthPolicy,
) -> Result<CompiledGrowth, Ext4Error> {
    let replacement = fs::read(replacement_path).map_err(Ext4Error::Io)?;
    let mut image = Ext4Image::open(origin_path)?;
    let inode_number = image.resolve_path(target_path)?;
    image.compile_growth(inode_number, &replacement, policy)
}

impl Ext4Image {
    fn compile_growth(
        &mut self,
        inode_number: u32,
        replacement: &[u8],
        policy: GrowthPolicy,
    ) -> Result<CompiledGrowth, Ext4Error> {
        let inode = self.read_inode(inode_number)?;
        validate_allocator_inode(inode_number, &inode)?;
        let blocks = self.file_blocks(&inode)?;
        if blocks.len() != 1 || inode.size != u64::from(self.superblock.block_size) {
            return Err(Ext4Error::UnsupportedFilesystemFeature(
                "allocator growth requires a one-block source file",
            ));
        }

        let block_size = usize::try_from(self.superblock.block_size)
            .map_err(|_| Ext4Error::ArithmeticOverflow)?;
        if replacement.len() % block_size != 0 {
            return Err(Ext4Error::UnsupportedFilesystemFeature(
                "allocator growth replacement must be filesystem-block aligned",
            ));
        }
        let effective_blocks = replacement.len() / block_size;
        let new_data_blocks = effective_blocks
            .checked_sub(1)
            .ok_or(Ext4Error::UnsupportedFilesystemFeature(
                "allocator growth requires at least one new data block",
            ))?;
        policy.validate(new_data_blocks)?;

        let origin_data = self.read_block(blocks[0])?;
        if replacement.get(..block_size) != Some(origin_data.as_slice()) {
            return Err(Ext4Error::UnsupportedFilesystemFeature(
                "allocator growth requires existing data blocks to remain unchanged",
            ));
        }

        let geometry = self.allocation_geometry()?;
        let group = block_group_for(
            blocks[0],
            geometry.first_data_block,
            geometry.blocks_per_group,
        )?;
        let descriptor = self.group_descriptor_location(group, geometry)?;
        if descriptor.flags & EXT4_BG_BLOCK_UNINIT != 0 {
            return Err(Ext4Error::UnsupportedFilesystemFeature(
                "allocator growth refuses an uninitialized block bitmap",
            ));
        }
        let allocated_blocks =
            u32::try_from(new_data_blocks).map_err(|_| Ext4Error::ArithmeticOverflow)?;
        if descriptor.free_blocks < allocated_blocks {
            return Err(Ext4Error::UnsupportedFilesystemFeature(
                "target block group has insufficient free blocks",
            ));
        }

        let mut bitmap_shadow = self.read_block(descriptor.block_bitmap)?;
        let allocated_run_start = find_and_set_free_run(
            &mut bitmap_shadow,
            group,
            geometry.first_data_block,
            geometry.blocks_per_group,
            self.superblock.blocks_count,
            new_data_blocks,
        )?;

        let sectors_per_block = u64::from(self.superblock.block_size) / SECTOR_SIZE;
        let mut shadow = Vec::new();
        let mut replacements = Vec::with_capacity(new_data_blocks.saturating_add(4));
        append_new_data_run(
            &mut shadow,
            &mut replacements,
            replacement,
            block_size,
            allocated_run_start,
            new_data_blocks,
            sectors_per_block,
        )?;

        let added_sectors = sectors_per_block
            .checked_mul(u64::try_from(new_data_blocks).map_err(|_| Ext4Error::ArithmeticOverflow)?)
            .ok_or(Ext4Error::ArithmeticOverflow)?;
        let effective_size = u64::from(self.superblock.block_size)
            .checked_mul(
                u64::try_from(effective_blocks).map_err(|_| Ext4Error::ArithmeticOverflow)?,
            )
            .ok_or(Ext4Error::ArithmeticOverflow)?;
        let inode_plan = InodeGrowthPlan {
            inode_number,
            inode: &inode,
            old_block: blocks[0],
            new_run_start: allocated_run_start,
            new_block_count: new_data_blocks,
            checksum_seed: geometry.checksum_seed,
            sectors_per_block,
            added_sectors,
            effective_size,
        };
        self.append_growth_inode_shadow(&inode_plan, &mut shadow, &mut replacements)?;

        let delta = AllocatorDelta {
            geometry,
            allocated_blocks,
        };
        self.update_block_bitmap_checksum_and_descriptor(
            descriptor,
            delta,
            &bitmap_shadow,
            sectors_per_block,
            &mut shadow,
            &mut replacements,
        )?;
        self.append_superblock_allocator_shadow(
            delta,
            sectors_per_block,
            &mut shadow,
            &mut replacements,
        )?;

        let total_sectors = self.image_bytes / SECTOR_SIZE;
        let map = LoomMap::from_replacements(SectorCount(total_sectors), &replacements)
            .map_err(Ext4Error::Map)?;
        Ok(build_compiled_growth(
            map,
            shadow,
            self.superblock.block_size,
            inode_number,
            allocated_run_start,
            new_data_blocks,
        ))
    }

'''
          text = replace_span(
