          extent_run = r'''fn update_extent_root_for_run(
    raw_inode: &mut [u8],
    parsed_root: &[u8; INODE_BLOCK_ROOT_LEN],
    old_block: u64,
    new_run_start: u64,
    new_block_count: usize,
) -> Result<(), Ext4Error> {
    let root_end = INODE_BLOCK_ROOT
        .checked_add(INODE_BLOCK_ROOT_LEN)
        .ok_or(Ext4Error::ArithmeticOverflow)?;
    let root = raw_inode
        .get_mut(INODE_BLOCK_ROOT..root_end)
        .ok_or(Ext4Error::UnexpectedEndOfStructure)?;
    if root != parsed_root {
        return Err(Ext4Error::InvalidFilesystem(
            "inode extent root changed during compilation",
        ));
    }
    if read_u16(root, 0)? != EXT4_EXTENT_MAGIC
        || read_u16(root, 6)? != 0
        || read_u16(root, 2)? != 1
    {
        return Err(Ext4Error::UnsupportedInodeFeature(
            "allocator growth requires one depth-0 extent",
        ));
    }

    let first = root
        .get(12..24)
        .ok_or(Ext4Error::UnexpectedEndOfStructure)?;
    let logical = read_u32(first, 0)?;
    let length = read_u16(first, 4)?;
    let physical = (u64::from(read_u16(first, 6)?) << 32) | u64::from(read_u32(first, 8)?);
    if logical != 0 || length != 1 || physical != old_block {
        return Err(Ext4Error::UnsupportedInodeFeature(
            "allocator growth source extent is not one logical block",
        ));
    }

    let new_length = u16::try_from(new_block_count).map_err(|_| Ext4Error::ArithmeticOverflow)?;
    if new_run_start == old_block.saturating_add(1) {
        let combined = new_length
            .checked_add(1)
            .ok_or(Ext4Error::ArithmeticOverflow)?;
        write_u16(root, 16, combined)?;
        return Ok(());
    }

    if read_u16(root, 4)? < 2 {
        return Err(Ext4Error::UnsupportedInodeFeature(
            "inode extent root has no room for the new contiguous run",
        ));
    }
    write_u16(root, 2, 2)?;
    let second = root
        .get_mut(24..36)
        .ok_or(Ext4Error::UnexpectedEndOfStructure)?;
    second.fill(0);
    write_u32(second, 0, 1)?;
    write_u16(second, 4, new_length)?;
    let physical_bytes = new_run_start.to_le_bytes();
    write_u16(
        second,
        6,
        u16::from_le_bytes([physical_bytes[4], physical_bytes[5]]),
    )?;
    write_u32(
        second,
        8,
        u32::from_le_bytes([
            physical_bytes[0],
            physical_bytes[1],
            physical_bytes[2],
            physical_bytes[3],
        ]),
    )
}

