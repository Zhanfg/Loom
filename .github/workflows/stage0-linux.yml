name: stage-linux

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-filesystem-fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs erofs-utils dmsetup util-linux
          sudo modprobe dm_mod
          sudo modprobe dm_linear || true
          sudo modprobe erofs || true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Stage 8 effective block store
        run: cargo test -p loom-view --test effective_store

      - name: Stage 0 ext4 sparse substitution
        run: bash tests/integration/stage0_ext4_dm_linear.sh

      - name: Stage 1 ext4 path compiler
        run: bash tests/integration/stage1_ext4_compiler.sh

      - name: Stage 1 partial final block
        run: bash tests/integration/stage1_ext4_partial_block.sh

      - name: Stage 1.1 ext4 block-size matrix
        run: bash tests/integration/stage1_ext4_block_sizes.sh

      - name: Stage 1.1 sparse block delta
        run: bash tests/integration/stage1_ext4_block_delta.sh

      - name: Stage 1.1 sparse-file rejection
        run: bash tests/integration/stage1_ext4_sparse_reject.sh

      - name: Stage 2 inode resize
        run: bash tests/integration/stage2_ext4_inode_resize.sh

      - name: Stage 2 allocation-boundary rejection
        run: bash tests/integration/stage2_ext4_resize_reject.sh

      - name: Stage 2 block-size matrix
        run: bash tests/integration/stage2_ext4_block_sizes.sh

      - name: Stage 3 block allocation weaving
        run: bash tests/integration/stage3_ext4_block_allocation.sh

      - name: Stage 4 create-file weaving
        run: bash tests/integration/stage4_ext4_create_file.sh

      - name: Stage 5 remove-file weaving
        run: bash tests/integration/stage5_ext4_remove_file.sh

      - name: Stage 6 SELinux xattr weaving
        run: bash tests/integration/stage6_ext4_selinux_xattr.sh

      - name: Stage 7 effective-view transaction
        run: bash tests/integration/stage7_ext4_transaction_view.sh

      - name: Stage 9 EROFS flat-plain weaving
        run: bash tests/integration/stage9_erofs_flat_plain.sh

      - name: Stage 10 compressed EROFS pcluster swap
        run: bash tests/integration/stage10_erofs_compressed_pcluster.sh
