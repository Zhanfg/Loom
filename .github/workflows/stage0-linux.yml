          free_run = r'''fn find_and_set_free_run(
    bitmap: &mut [u8],
    group: u32,
    first_data_block: u64,
    blocks_per_group: u32,
    blocks_count: u64,
    count: usize,
) -> Result<u64, Ext4Error> {
    if count == 0 {
        return Err(Ext4Error::UnsupportedFilesystemFeature(
            "allocator growth requires at least one new data block",
        ));
    }
    let count_u64 = u64::try_from(count).map_err(|_| Ext4Error::ArithmeticOverflow)?;
    let group_start = first_data_block
        .checked_add(
            u64::from(group)
                .checked_mul(u64::from(blocks_per_group))
                .ok_or(Ext4Error::ArithmeticOverflow)?,
        )
        .ok_or(Ext4Error::ArithmeticOverflow)?;
    let remaining = blocks_count.saturating_sub(group_start);
    let valid_blocks = remaining.min(u64::from(blocks_per_group));
    if count_u64 > valid_blocks {
        return Err(Ext4Error::UnsupportedFilesystemFeature(
            "target block group cannot contain the requested contiguous run",
        ));
    }

    let mut run_start = 0_u64;
    let mut run_len = 0_u64;
    for bit in 0..valid_blocks {
        let byte_index = usize::try_from(bit / 8).map_err(|_| Ext4Error::ArithmeticOverflow)?;
        let bit_index = u8::try_from(bit % 8).map_err(|_| Ext4Error::ArithmeticOverflow)?;
        let byte = *bitmap
            .get(byte_index)
            .ok_or(Ext4Error::UnexpectedEndOfStructure)?;
        let is_free = byte & (1_u8 << bit_index) == 0;
        if is_free {
            if run_len == 0 {
                run_start = bit;
            }
            run_len = run_len
                .checked_add(1)
                .ok_or(Ext4Error::ArithmeticOverflow)?;
            if run_len == count_u64 {
                let run_end = run_start
                    .checked_add(count_u64)
                    .ok_or(Ext4Error::ArithmeticOverflow)?;
                for set_bit in run_start..run_end {
                    let set_byte_index = usize::try_from(set_bit / 8)
                        .map_err(|_| Ext4Error::ArithmeticOverflow)?;
                    let set_bit_index =
                        u8::try_from(set_bit % 8).map_err(|_| Ext4Error::ArithmeticOverflow)?;
                    let target = bitmap
                        .get_mut(set_byte_index)
                        .ok_or(Ext4Error::UnexpectedEndOfStructure)?;
                    *target |= 1_u8 << set_bit_index;
                }
                return group_start
                    .checked_add(run_start)
                    .ok_or(Ext4Error::ArithmeticOverflow);
            }
        } else {
            run_len = 0;
        }
    }

    Err(Ext4Error::UnsupportedFilesystemFeature(
        "target block group has no suitable contiguous free-block run",
    ))
}

fn append_new_data_run(
    shadow: &mut Vec<u8>,
    replacements: &mut Vec<ReplacementExtent>,
    replacement: &[u8],
    block_size: usize,
    run_start: u64,
    count: usize,
    sectors_per_block: u64,
) -> Result<(), Ext4Error> {
    for index in 0..count {
        let replacement_block = index
            .checked_add(1)
            .ok_or(Ext4Error::ArithmeticOverflow)?;
        let start = replacement_block
            .checked_mul(block_size)
            .ok_or(Ext4Error::ArithmeticOverflow)?;
        let end = start
            .checked_add(block_size)
            .ok_or(Ext4Error::ArithmeticOverflow)?;
        let data = replacement
            .get(start..end)
            .ok_or(Ext4Error::UnexpectedEndOfStructure)?;
        let physical = run_start
            .checked_add(u64::try_from(index).map_err(|_| Ext4Error::ArithmeticOverflow)?)
            .ok_or(Ext4Error::ArithmeticOverflow)?;
        append_shadow_block(
            shadow,
            replacements,
            physical,
            sectors_per_block,
            data,
        )?;
    }
    Ok(())
}

