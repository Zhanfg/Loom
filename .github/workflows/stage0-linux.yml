          group_counter = r'''fn decrement_group_free_blocks(
    descriptor: &mut [u8],
    has_64bit: bool,
    count: u32,
) -> Result<(), Ext4Error> {
    let low = u32::from(read_u16(descriptor, GD_FREE_BLOCKS_LO)?);
    let high = if has_64bit {
        u32::from(read_u16(descriptor, GD_FREE_BLOCKS_HI)?)
    } else {
        0
    };
    let current = (high << 16) | low;
    let updated = current.checked_sub(count).ok_or(Ext4Error::InvalidFilesystem(
        "group free-block count underflow",
    ))?;
    let bytes = updated.to_le_bytes();
    write_u16(
        descriptor,
        GD_FREE_BLOCKS_LO,
        u16::from_le_bytes([bytes[0], bytes[1]]),
    )?;
    if has_64bit {
        write_u16(
            descriptor,
            GD_FREE_BLOCKS_HI,
            u16::from_le_bytes([bytes[2], bytes[3]]),
        )?;
    }
    Ok(())
}

