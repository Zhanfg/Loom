name: stage-linux

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-ext4-fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs dmsetup util-linux
          sudo modprobe dm_mod
          sudo modprobe dm_linear || true

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Upload rustfmt result
        uses: actions/upload-artifact@v4
        with:
          name: stage1-rustfmt-sources
          path: crates
          if-no-files-found: error
          retention-days: 1

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Stage 0 ext4 sparse substitution
        run: bash tests/integration/stage0_ext4_dm_linear.sh

      - name: Stage 1 ext4 path compiler
        run: bash tests/integration/stage1_ext4_compiler.sh

      - name: Formatting gate
        run: git diff --exit-code -- crates
