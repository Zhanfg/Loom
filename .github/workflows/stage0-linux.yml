name: stage-linux

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-and-ext4-fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Stage 1 branch
        uses: actions/checkout@v5
        with:
          ref: feat/stage1-ext4-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs dmsetup util-linux
          sudo modprobe dm_mod
          sudo modprobe dm_linear || true

      - name: Normalize must-use API contracts once
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/loom-map/src/lib.rs')
          text = path.read_text()
          edits = [
              (
                  '    pub fn total_sectors(&self) -> SectorCount {',
                  '    #[must_use]\n    pub fn total_sectors(&self) -> SectorCount {'
              ),
              (
                  '    pub fn extents(&self) -> &[Extent] {',
                  '    #[must_use]\n    pub fn extents(&self) -> &[Extent] {'
              ),
          ]
          changed = False
          for needle, replacement in edits:
              if replacement in text:
                  continue
              if needle not in text:
                  raise SystemExit(f'expected API signature not found: {needle!r}')
              text = text.replace(needle, replacement, 1)
              changed = True
          if changed:
              path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit normalized sources
        run: |
          if ! git diff --quiet -- crates; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "style: complete Stage 1 API contracts"
            git push origin HEAD:feat/stage1-ext4-compiler
          fi

      - name: Clippy diagnostics
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Stage 0 ext4 sparse substitution
        run: bash tests/integration/stage0_ext4_dm_linear.sh

      - name: Stage 1 ext4 path compiler
        run: bash tests/integration/stage1_ext4_compiler.sh

      - name: Clippy hard gate
        run: cargo clippy --workspace --all-targets -- -D warnings
