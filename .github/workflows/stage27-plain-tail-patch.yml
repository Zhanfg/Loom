name: stage27-plain-tail-patch

on:
  push:
    branches:
      - feat/stage27-erofs-partial-tail
    paths:
      - .github/workflows/stage27-plain-tail-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage27-erofs-partial-tail
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add constrained ordinary PLAIN-tail support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/loom-erofs/src/compact_core.rs')
          text = path.read_text()

          def once(old, new):
              global text
              assert text.count(old) == 1, old[:120]
              text = text.replace(old, new, 1)

          once(
              'const LCLUSTER_HEAD1: u16 = 1;\nconst LCLUSTER_NONHEAD: u16 = 2;',
              'const LCLUSTER_PLAIN: u16 = 0;\nconst LCLUSTER_HEAD1: u16 = 1;\nconst LCLUSTER_NONHEAD: u16 = 2;',
          )

          once(
              'struct Head {\n    lcn: usize,\n    pcluster: u64,\n}',
              'struct Head {\n    lcn: usize,\n    pcluster: u64,\n    kind: u16,\n}',
          )

          once(
              '        let (block, encoded_len) = encode_extent(head.lcn, extent)?;\n        encoded_blocks.push(block);\n        encoded_bytes.push(encoded_len);',
              '''        let (block, encoded_len) = match head.kind {
            LCLUSTER_HEAD1 => encode_extent(head.lcn, extent)?,
            LCLUSTER_PLAIN => encode_plain_extent(extent)?,
            _ => {
                return Err(CoreError::InvalidFilesystem(
                    "recovered ordinary compact head has an unsupported type",
                ))
            }
        };
        encoded_blocks.push(block);
        encoded_bytes.push(encoded_len);''',
          )

          once(
              'fn encode_extent(head_lcn: usize, extent: &[u8]) -> Result<(Vec<u8>, usize), CoreError> {',
              '''fn encode_plain_extent(extent: &[u8]) -> Result<(Vec<u8>, usize), CoreError> {
    if extent.is_empty() || extent.len() > BLOCK_BYTES {
        return Err(CoreError::UnsupportedInode(
            "zero-offset PLAIN extent must occupy one non-empty logical block",
        ));
    }
    let mut block = vec![0_u8; BLOCK_BYTES];
    block[..extent.len()].copy_from_slice(extent);
    Ok((block, extent.len()))
}

fn encode_extent(head_lcn: usize, extent: &[u8]) -> Result<(Vec<u8>, usize), CoreError> {''',
          )

          once(
              '''    if origin
        .heads
        .iter()
        .map(|head| head.lcn)
        .ne(replacement.heads.iter().map(|head| head.lcn))
    {
        return Err(CoreError::IncompatibleReplacement(
            "compressed HEAD-lcluster topology differs",
        ));
    }''',
              '''    if origin
        .heads
        .iter()
        .map(|head| (head.lcn, head.kind))
        .ne(replacement.heads.iter().map(|head| (head.lcn, head.kind)))
    {
        return Err(CoreError::IncompatibleReplacement(
            "compressed head-lcluster/type topology differs",
        ));
    }''',
          )

          once(
              '''            match entry.kind {
                LCLUSTER_HEAD1 => {
                    if entry.low != 0 {
                        return Err(CoreError::UnsupportedInode(
                            "compact core requires zero-offset HEAD1 lclusters",
                        ));
                    }
                    let pcluster = self.reconstruct_head_pcluster(ebase, total, lcn, *entry)?;
                    heads.push(Head { lcn, pcluster });
                }
                LCLUSTER_NONHEAD => {}
                _ => {
                    return Err(CoreError::UnsupportedInode(
                        "compact core supports only HEAD1 and NONHEAD entries",
                    ))
                }
            }''',
              '''            match entry.kind {
                LCLUSTER_HEAD1 => {
                    if entry.low != 0 {
                        return Err(CoreError::UnsupportedInode(
                            "compact core requires zero-offset HEAD1 lclusters",
                        ));
                    }
                    let pcluster = self.reconstruct_head_pcluster(ebase, total, lcn, *entry)?;
                    heads.push(Head {
                        lcn,
                        pcluster,
                        kind: LCLUSTER_HEAD1,
                    });
                }
                LCLUSTER_PLAIN => {
                    if lcn + 1 != total || entry.low != 0 {
                        return Err(CoreError::UnsupportedInode(
                            "compact core supports only a zero-offset PLAIN EOF lcluster",
                        ));
                    }
                    let pcluster = self.reconstruct_head_pcluster(ebase, total, lcn, *entry)?;
                    heads.push(Head {
                        lcn,
                        pcluster,
                        kind: LCLUSTER_PLAIN,
                    });
                }
                LCLUSTER_NONHEAD => {}
                _ => {
                    return Err(CoreError::UnsupportedInode(
                        "compact core supports only EOF PLAIN, HEAD1 and NONHEAD entries",
                    ))
                }
            }''',
          )

          once(
              '''            heads: vec![Head {
                lcn: 0,
                pcluster: 10,
            }],''',
              '''            heads: vec![Head {
                lcn: 0,
                pcluster: 10,
                kind: LCLUSTER_HEAD1,
            }],''',
          )

          marker = '''    #[test]
    fn later_extent_codec_failure_happens_before_view_construction() {'''
          assert text.count(marker) == 1
          tests = '''    #[test]
    fn plain_tail_is_raw_and_zero_padded() {
        let tail = vec![0x5a_u8; 3973];
        let (block, encoded) = encode_plain_extent(&tail).unwrap();
        assert_eq!(encoded, tail.len());
        assert_eq!(&block[..tail.len()], tail.as_slice());
        assert!(block[tail.len()..].iter().all(|byte| *byte == 0));
    }

    #[test]
    fn topology_compatibility_rejects_head_type_changes() {
        let origin = Topology {
            nid: 1,
            logical_size: 8192,
            algorithm: 0,
            advise: ADVISE_COMPACTED_2B,
            logical_lclusters: 2,
            compact_2b_entries: 0,
            heads: vec![Head {
                lcn: 0,
                pcluster: 10,
                kind: LCLUSTER_HEAD1,
            }],
        };
        let mut replacement = origin.clone();
        replacement.heads[0].kind = LCLUSTER_PLAIN;
        assert!(matches!(
            validate_compatible_topology(&origin, &replacement),
            Err(CoreError::IncompatibleReplacement(
                "compressed head-lcluster/type topology differs"
            ))
        ));
    }

'''
          text = text.replace(marker, tests + marker, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          grep -q 'const LCLUSTER_PLAIN: u16 = 0' crates/loom-erofs/src/compact_core.rs
          grep -q 'zero-offset PLAIN EOF lcluster' crates/loom-erofs/src/compact_core.rs
          grep -q 'plain_tail_is_raw_and_zero_padded' crates/loom-erofs/src/compact_core.rs
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'Loom Stage 27 maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/stage27-plain-tail-patch.yml
          git add crates/loom-erofs/src/compact_core.rs
          git commit -m 'stage27: support ordinary PLAIN EOF tails'
          git push origin HEAD:feat/stage27-erofs-partial-tail
