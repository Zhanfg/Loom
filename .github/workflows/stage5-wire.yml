name: stage5-wire

on:
  push:
    branches:
      - feat/stage5-ext4-remove-file

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage5-ext4-remove-file
      - name: Wire remove module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/loom-ext4/src/lib.rs')
          s = p.read_text()
          old = 'mod create;\nmod resize;\n\npub use allocate::{compile_grow_with_block_allocation, CompiledAllocationGrow};\npub use create::{compile_create_file, CompiledCreateFile};\npub use resize::{compile_resize_within_allocation, CompiledResize};'
          new = 'mod create;\nmod remove;\nmod resize;\n\npub use allocate::{compile_grow_with_block_allocation, CompiledAllocationGrow};\npub use create::{compile_create_file, CompiledCreateFile};\npub use remove::{compile_remove_file, CompiledRemoveFile};\npub use resize::{compile_resize_within_allocation, CompiledResize};'
          if new not in s:
              if old not in s:
                  raise SystemExit('expected module prelude not found')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-ext4/src/lib.rs crates/loom-ext4/src/remove.rs
          git commit -m 'feat(ext4): wire Stage 5 remove compiler'
          git push origin HEAD:feat/stage5-ext4-remove-file
