name: Android flashable module

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Filesystem compiler/runtime source branch, tag, or commit SHA to package'
        required: true
        default: 'feat/alpha5-metadata-raw-shadow'
        type: string
      version_name:
        description: 'Module version name'
        required: true
        default: '0.5.0-early-prepare-alpha5'
        type: string
      version_code:
        description: 'Numeric module version code'
        required: true
        default: '10500'
        type: string
      run_host_tests:
        description: 'Run host workspace tests before packaging'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
      - infra/android-module-pipeline
      - 'feat/android-sidecar-*'
      - 'feat/android-shadow-sidecar-*'
      - 'feat/unified-kernel-*'
      - 'feat/alpha3-*'
      - 'feat/alpha4-*'
      - 'feat/alpha5-*'
  pull_request:
    paths:
      - '.github/workflows/android-module.yml'
      - 'packaging/android/**'
      - 'kernel/**'

permissions:
  contents: read

jobs:
  package-arm64:
    name: Build arm64 Alpha 5 module ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout packaging pipeline
        uses: actions/checkout@v5
        with:
          path: pipeline

      - name: Validate Android runtime safety
        shell: bash
        run: |
          set -euo pipefail
          bash pipeline/packaging/android/tests/sidecar_runtime_test.sh
          bash pipeline/packaging/android/tests/shadow_runtime_test.sh
          bash pipeline/packaging/android/tests/shadow_flat_runtime_test.sh
          bash pipeline/packaging/android/tests/compose_runtime_test.sh
          bash pipeline/packaging/android/tests/early_prepare_runtime_test.sh

      - name: Validate kernel runtime UAPI
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            pipeline/kernel/tests/uapi_layout_test.c \
            -o /tmp/loom-uapi-layout-test
          /tmp/loom-uapi-layout-test

      - name: Resolve source and version
        id: meta
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.source_ref }}
          REQUESTED_VERSION: ${{ inputs.version_name }}
          REQUESTED_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          DEFAULT_SOURCE_REF='feat/alpha5-metadata-raw-shadow'
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            SOURCE_REF="${REQUESTED_REF:-$DEFAULT_SOURCE_REF}"
            VERSION_NAME="$REQUESTED_VERSION"
            VERSION_CODE="$REQUESTED_CODE"
          else
            SOURCE_REF="$DEFAULT_SOURCE_REF"
            VERSION_NAME="0.5.0-early-prepare-alpha5+run${GITHUB_RUN_NUMBER}"
            VERSION_CODE="$((10500 + GITHUB_RUN_NUMBER))"
          fi
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          SAFE_VERSION="$(printf '%s' "$VERSION_NAME" | tr -c 'A-Za-z0-9._+-' '-')"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout Loom filesystem compiler source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.source_ref }}
          path: source
          fetch-depth: 1

      - name: Resolve exact source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C source rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Install Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Host format and lint checks
        working-directory: source
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Host workspace tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_host_tests }}
        working-directory: source
        run: cargo test --workspace

      - name: Validate source block proofs
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe loop || true
          sudo modprobe dm_mod || true
          bash source/tests/integration/alpha4_dm_flatten.sh
          bash source/tests/integration/alpha5_metadata_raw_shadow.sh

      - name: Configure Android NDK toolchain
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_ROOT="$(find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$NDK_ROOT" && -d "$NDK_ROOT" ]] || { echo "No Android NDK found under $SDK_ROOT/ndk" >&2; exit 1; }
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="$TOOLCHAIN/aarch64-linux-android21-clang"
          [[ -x "$LINKER" ]] || { echo "Missing Android arm64 linker: $LINKER" >&2; exit 1; }
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$LINKER" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/llvm-strip" >> "$GITHUB_ENV"
          echo "LOOM_ANDROID_CC=$LINKER" >> "$GITHUB_ENV"
          echo "root=$NDK_ROOT" >> "$GITHUB_OUTPUT"
          "$LINKER" --version | head -n 1

      - name: Build Loom for Android arm64
        working-directory: source
        run: |
          set -euo pipefail
          cargo build --release -p loom-cli \
            --bin loom --bin loom-flatten --bin loom-early-map \
            --target aarch64-linux-android
          "$LOOM_ANDROID_CC" -std=c11 -O2 -Wall -Wextra -Werror \
            tools/loom-fiemap.c -o target/aarch64-linux-android/release/loom-fiemap
          for binary in loom loom-flatten loom-early-map loom-fiemap; do
            "$STRIP" "target/aarch64-linux-android/release/$binary"
            file "target/aarch64-linux-android/release/$binary"
            readelf -h "target/aarch64-linux-android/release/$binary" | grep -q 'Machine:.*AArch64'
          done

      - name: Package KernelSU module ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIP="dist/Loom-Android-${{ steps.meta.outputs.safe_version }}-${{ steps.source.outputs.short_sha }}-arm64.zip"
          bash pipeline/packaging/android/build-module.sh \
            source/target/aarch64-linux-android/release/loom \
            source/target/aarch64-linux-android/release/loom-flatten \
            source/target/aarch64-linux-android/release/loom-early-map \
            source/target/aarch64-linux-android/release/loom-fiemap \
            "$ZIP" \
            '${{ steps.meta.outputs.version_name }}' \
            '${{ steps.meta.outputs.version_code }}' \
            '${{ steps.meta.outputs.source_ref }}' \
            '${{ steps.source.outputs.sha }}'
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$ZIP.sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Loom-Android-${{ steps.meta.outputs.safe_version }}-${{ steps.source.outputs.short_sha }}-arm64" >> "$GITHUB_OUTPUT"

      - name: Validate module archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP='${{ steps.package.outputs.zip }}'
          unzip -t "$ZIP" >/dev/null
          for entry in \
            module.prop \
            bin/loom bin/loom-flatten bin/loom-early-map bin/loom-fiemap \
            bin/loom-sidecar bin/loom-shadow bin/loom-shadow-layered bin/loom-compose bin/loom-early-prepare \
            sidecar.conf shadow.conf compose.conf early.conf \
            customize.sh post-fs-data.sh service.sh boot-completed.sh action.sh uninstall.sh \
            skip_mount build-info.txt; do
            unzip -Z1 "$ZIP" | grep -Fxq "$entry" || { echo "Missing module entry: $entry" >&2; exit 1; }
          done
          unzip -p "$ZIP" module.prop
          unzip -p "$ZIP" build-info.txt
          for binary in loom loom-flatten loom-early-map loom-fiemap; do
            unzip -p "$ZIP" "bin/$binary" > "/tmp/$binary-android"
            chmod 0755 "/tmp/$binary-android"
            file "/tmp/$binary-android" | grep -q 'ARM aarch64\|ARM64\|aarch64'
          done
          unzip -p "$ZIP" bin/loom-shadow | grep -q 'loom-shadow-layered'
          unzip -p "$ZIP" bin/loom-shadow | grep -q 'LOOM_STABLE_DM_DEPTH=1'
          unzip -p "$ZIP" bin/loom-early-prepare | grep -q 'PREPARED_NOT_ACTIVE'
          unzip -p "$ZIP" boot-completed.sh | grep -q 'loom-compose.*commit'
          unzip -p "$ZIP" boot-completed.sh | grep -q 'loom-early-prepare.*prepare'
          unzip -p "$ZIP" early.conf | grep -Fxq 'LOOM_EARLY_PREPARE_ENABLED=0'
          unzip -p "$ZIP" early.conf | grep -Fxq 'LOOM_TAKEOVER=0'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'filesystem_fabric=origin-plus-aggregate-sparse-shadow'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'stable_composition=flattened-single-dm-linear'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'stable_dm_depth=1'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'early_snapshot_storage=metadata-ext4-raw-extents'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'early_snapshot_default=disabled'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'early_snapshot_state=prepared-not-active'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'early_shadow_loop_required=false'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'uses_overlayfs=false'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'uses_magic_mount=false'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'first_stage_takeover=false'
          unzip -p "$ZIP" build-info.txt | grep -Fxq 'system_takeover=false'
          if unzip -Z1 "$ZIP" | grep -qE '^([^/]+/){2,}module\.prop$'; then
            echo 'module.prop is incorrectly nested inside wrapper directories' >&2
            exit 1
          fi

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha256 }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          {
            echo '## Loom Android Alpha 5 early snapshot prepare artifact'
            echo
            echo "- Source ref: `${{ steps.meta.outputs.source_ref }}`"
            echo "- Source SHA: `${{ steps.source.outputs.sha }}`"
            echo "- Version: `${{ steps.meta.outputs.version_name }}` (`${{ steps.meta.outputs.version_code }}`)"
            echo "- Architecture: `arm64-v8a`"
            echo "- NDK: `${{ steps.ndk.outputs.root }}`"
            echo "- Artifact: `${{ steps.package.outputs.artifact_name }}`"
            echo "- Stable LoomFS: `one aggregate shadow + one final dm device`"
            echo "- Early snapshot backing: `ext4 /metadata physical extents`"
            echo "- Early shadow loop required: `false`"
            echo "- Early snapshot default: `disabled`"
            echo "- Early snapshot state: `prepared-not-active`"
            echo "- OverlayFS / Magic Mount in LoomFS path: `false / false`"
            echo "- First-stage /system takeover: `false`"
            echo
            echo '> Alpha 5 prepares all raw block mappings needed for a future first-stage handoff but deliberately does not activate them during boot.'
          } >> "$GITHUB_STEP_SUMMARY"
