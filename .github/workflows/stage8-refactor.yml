name: stage8-refactor

on:
  push:
    branches:
      - feat/stage8-effective-block-store

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage8-effective-block-store
      - name: Refactor Stage 7 onto loom-view
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tx = Path('crates/loom-ext4/src/transaction.rs')
          s = tx.read_text()
          s = s.replace('use loom_types::Source;\n', 'use loom_view::EffectiveBlockStore;\n', 1)
          start = s.index('/// Mutable editor over a compiled Loom shadow image.')
          end = s.index('/// Compiles a two-operation effective-view transaction:', start)
          s = s[:start] + s[end:]
          old = '''    let mut editor = EffectiveShadowEditor::new(created.map, created.shadow, created.block_size)?;
    let table_block = editor.shadow_block_mut(inode_table_block)?;'''
          new = '''    let mut view = EffectiveBlockStore::from_compiled(
        origin_path,
        created.block_size,
        &created.map,
        &created.shadow,
    )
    .map_err(Ext4Error::View)?;
    let table_block = view
        .block_mut(inode_table_block)
        .map_err(Ext4Error::View)?;'''
          if old not in s:
              raise SystemExit('Stage 7 editor construction marker missing')
          s = s.replace(old, new, 1)
          old = '''    let block_size = usize::try_from(editor.block_size).map_err(|_| Ext4Error::ArithmeticOverflow)?;
    let shadow_blocks = editor.shadow.len() / block_size;
    Ok(CompiledCreateSelinuxTransaction {
        map: editor.map,
        shadow: editor.shadow,
        block_size: created.block_size,
        inode: created.inode,
        value_bytes: value.len(),
        shadow_blocks,
    })'''
          new = '''    let finalized = view.finalize().map_err(Ext4Error::View)?;
    Ok(CompiledCreateSelinuxTransaction {
        map: finalized.map,
        shadow: finalized.shadow,
        block_size: finalized.block_size,
        inode: created.inode,
        value_bytes: value.len(),
        shadow_blocks: finalized.shadow_blocks,
    })'''
          if old not in s:
              raise SystemExit('Stage 7 editor finalization marker missing')
          s = s.replace(old, new, 1)
          if '#[cfg(test)]\nmod tests {' in s:
              s = s[:s.index('#[cfg(test)]\nmod tests {')]
          tx.write_text(s)

          lib = Path('crates/loom-ext4/src/lib.rs')
          s = lib.read_text()
          old = '    Checksum(checksum::ChecksumError),\n'
          new = old + '    View(loom_view::ViewError),\n'
          if 'View(loom_view::ViewError)' not in s:
              if old not in s: raise SystemExit('Ext4Error enum marker missing')
              s = s.replace(old, new, 1)
          old = '            Self::Checksum(error) => write!(f, "ext4 inode checksum error: {error}"),\n'
          new = old + '            Self::View(error) => write!(f, "Loom effective-view error: {error}"),\n'
          if 'Self::View(error) => write!(f, "Loom effective-view error: {error}"),' not in s:
              if old not in s: raise SystemExit('Ext4Error display marker missing')
              s = s.replace(old, new, 1)
          old = '            Self::Checksum(error) => Some(error),\n'
          new = old + '            Self::View(error) => Some(error),\n'
          if 'Self::View(error) => Some(error),' not in s:
              if old not in s: raise SystemExit('Ext4Error source marker missing')
              s = s.replace(old, new, 1)
          lib.write_text(s)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo check --workspace
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/loom-ext4/src/lib.rs crates/loom-ext4/src/transaction.rs
          git commit -m 'refactor(ext4): use generic effective block store'
          git push origin HEAD:feat/stage8-effective-block-store
