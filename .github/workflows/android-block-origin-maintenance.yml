name: Android block-origin maintenance

on:
  push:
    branches:
      - feat/android-block-origin-alpha2

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply block-device origin fix
        run: python3 .github/android_block_origin_fix.py
      - name: Rust quality gates
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Direct block-device EROFS proof
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils util-linux >/dev/null
          cargo build -p loom-cli
          work="$(mktemp -d)"
          trap 'sudo losetup -D >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          mkdir -p "$work/root"
          python3 - "$work/root/payload.bin" "$work/replacement.bin" <<'PY'
          import pathlib, sys
          origin = (b'LOOM-ANDROID-BLOCK-ORIGIN-' * 5000)[:98304]
          repl = (b'LOOM-ANDROID-BLOCK-REPLACEMENT-' * 5000)[:98304]
          pathlib.Path(sys.argv[1]).write_bytes(origin)
          pathlib.Path(sys.argv[2]).write_bytes(repl)
          PY
          mkfs.erofs -b4096 -zlz4 -E legacy-compress,noinline_data "$work/origin.erofs" "$work/root" >/dev/null
          loop="$(sudo losetup -f --show -r "$work/origin.erofs")"
          sudo "$(pwd)/target/debug/loom" erofs-compact-pcluster-swap --multi-encode \
            "$loop" /payload.bin "$work/replacement.bin" "$work/shadow.pack" \
            "$loop" __LOOM_SHADOW__ "$work/table.txt"
          test -s "$work/shadow.pack"
          test -s "$work/table.txt"
          grep -q '__LOOM_SHADOW__' "$work/table.txt"
          sudo losetup -d "$loop"
          trap - EXIT
          rm -rf "$work"
      - name: Commit verified source fix and cleanup maintenance files
        run: |
          set -euo pipefail
          rm -f .github/android_block_origin_fix.py .github/workflows/android-block-origin-maintenance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(erofs): support block-device origins on Android'
          git push origin HEAD:feat/android-block-origin-alpha2
