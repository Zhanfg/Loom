name: stage7-wire

on:
  push:
    branches:
      - feat/stage7-ext4-transaction-view

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage7-ext4-transaction-view
      - name: Wire transaction module and CLI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/loom-ext4/src/lib.rs')
          s = lib.read_text()
          if 'mod transaction;\n' not in s:
              marker = 'mod resize;\nmod xattr;\n'
              if marker not in s:
                  raise SystemExit('lib module marker missing')
              s = s.replace(marker, 'mod resize;\nmod transaction;\nmod xattr;\n', 1)
          export = 'pub use transaction::{compile_create_with_selinux_transaction, CompiledCreateSelinuxTransaction};\n'
          if export not in s:
              marker = 'pub use resize::{compile_resize_within_allocation, CompiledResize};\n'
              if marker not in s:
                  raise SystemExit('lib export marker missing')
              s = s.replace(marker, marker + export, 1)
          lib.write_text(s)

          main = Path('crates/loom-cli/src/main.rs')
          s = main.read_text()
          if 'mod stage7_command;\n' not in s:
              marker = '#![forbid(unsafe_code)]\n\n'
              if marker not in s:
                  raise SystemExit('CLI module marker missing')
              s = s.replace(marker, marker + 'mod stage7_command;\n\n', 1)
          command = '        "ext4-create-selinux" => stage7_command::command(&mut args)?,\n'
          if command not in s:
              marker = '        "ext4-selinux" => command_ext4_selinux(&mut args)?,\n'
              if marker not in s:
                  raise SystemExit('CLI match marker missing')
              s = s.replace(marker, marker + command, 1)
          main.write_text(s)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-ext4/src/lib.rs crates/loom-ext4/src/transaction.rs crates/loom-cli/src/main.rs crates/loom-cli/src/stage7_command.rs tests/integration/stage7_ext4_transaction_view.sh
          git commit -m 'feat(ext4): wire Stage 7 effective-view transaction'
          git push origin HEAD:feat/stage7-ext4-transaction-view
