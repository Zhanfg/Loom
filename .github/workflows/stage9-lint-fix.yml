name: stage9-lint-fix
on:
  push:
    branches:
      - feat/stage9-erofs-flat-plain
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage9-erofs-flat-plain
      - name: Fix octal literal grouping
        run: |
          sed -i 's/0o170000/0o170_000/g; s/0o040000/0o040_000/g; s/0o100000/0o100_000/g' crates/loom-erofs/src/lib.rs
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-erofs/src/lib.rs
          git commit -m 'style(erofs): group POSIX mode literals'
          git push origin HEAD:feat/stage9-erofs-flat-plain
