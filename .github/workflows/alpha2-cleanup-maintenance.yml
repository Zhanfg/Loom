name: Alpha2 cleanup maintenance

on:
  push:
    branches:
      - feat/android-shadow-sidecar-alpha2

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply cleanup patch
        run: python3 .github/alpha2_cleanup_fix.py
      - name: Run Android runtime gates
        run: |
          set -euo pipefail
          bash packaging/android/tests/sidecar_runtime_test.sh
          bash packaging/android/tests/shadow_runtime_test.sh
      - name: Commit verified patch and clean maintenance files
        run: |
          set -euo pipefail
          rm -f .github/alpha2_cleanup_fix.py .github/workflows/alpha2-cleanup-maintenance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(android): remove partial dm state on shadow activation failure'
          git push origin HEAD:feat/android-shadow-sidecar-alpha2
