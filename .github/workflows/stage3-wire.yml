name: stage3-wire

on:
  push:
    branches:
      - feat/stage3-ext4-block-allocation

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/stage3-ext4-block-allocation

      - name: Wire allocate module without replacing lib.rs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/loom-ext4/src/lib.rs')
          s = p.read_text()
          old = "mod checksum;\nmod resize;\n\npub use resize::{compile_resize_within_allocation, CompiledResize};"
          new = "mod allocate;\nmod checksum;\nmod resize;\n\npub use allocate::{compile_grow_with_block_allocation, CompiledAllocationGrow};\npub use resize::{compile_resize_within_allocation, CompiledResize};"
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('expected loom-ext4 module prelude not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit exact wiring
        run: |
          if git diff --quiet -- crates/loom-ext4/src/lib.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-ext4/src/lib.rs
          git commit -m 'feat(ext4): wire Stage 3 allocator compiler'
          git push origin HEAD:feat/stage3-ext4-block-allocation
