name: stage26-core-patch

on:
  push:
    branches:
      - feat/stage26-erofs-xattr-bearing-paths
    paths:
      - .github/workflows/stage26-core-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage26-erofs-xattr-bearing-paths
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Stage 26 compact-core patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/loom-erofs/src/compact_core.rs')
          text = path.read_text()

          directory_guard = '''        if directory.xattr_size != 0 {
              return Err(CoreError::UnsupportedInode(
                  "compact path traversal refuses directory xattrs",
              ));
          }
'''
          target_guard = '''    if inode.xattr_size != 0 {
              return Err(CoreError::UnsupportedInode(
                  "compact target must not carry xattrs",
              ));
          }
'''

          assert text.count(directory_guard) == 1
          assert text.count(target_guard) == 1
          text = text.replace(directory_guard, '', 1)
          text = text.replace(target_guard, '', 1)
          path.write_text(text)
          PY
          cargo fmt --all
          ! grep -q 'compact path traversal refuses directory xattrs' crates/loom-erofs/src/compact_core.rs
          ! grep -q 'compact target must not carry xattrs' crates/loom-erofs/src/compact_core.rs
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'Loom Stage 26 maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/stage26-core-patch.yml
          git add crates/loom-erofs/src/compact_core.rs
          git commit -m 'stage26: accept xattr-bearing compact EROFS paths'
          git push origin HEAD:feat/stage26-erofs-xattr-bearing-paths
