name: stage3-clippy-fix

on:
  push:
    branches:
      - feat/stage3-ext4-block-allocation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/stage3-ext4-block-allocation

      - name: Apply narrow Stage 3 lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/loom-ext4/src/allocate.rs')
          s = p.read_text()

          replacements = {
            '    fn compile_one_block_growth(\n': '    #[allow(clippy::too_many_lines)] // transaction orchestration; helpers own the individual mutations\n    fn compile_one_block_growth(\n',
            '    fn build_grown_inode_block(\n': '    #[allow(clippy::too_many_arguments)] // all arguments are explicit ext4 accounting inputs\n    fn build_grown_inode_block(\n',
            'write_u32(&mut raw, SB_FREE_BLOCKS_LO, new_free as u32)?;': 'write_u32(&mut raw, SB_FREE_BLOCKS_LO, low_u32(new_free))?;',
            'write_u32(&mut raw, SB_FREE_BLOCKS_HI, (new_free >> 32) as u32)?;': 'write_u32(\n                &mut raw,\n                SB_FREE_BLOCKS_HI,\n                u32::try_from(new_free >> 32).map_err(|_| Ext4Error::ArithmeticOverflow)?,\n            )?;',
            'write_u16(&mut group.descriptor, GD_FREE_BLOCKS_LO, new_free as u16)?;': 'write_u16(\n        &mut group.descriptor,\n        GD_FREE_BLOCKS_LO,\n        low_u16(u64::from(new_free)),\n    )?;',
            '(new_free >> 16) as u16,': 'u16::try_from(new_free >> 16).map_err(|_| Ext4Error::ArithmeticOverflow)?,',
            'bitmap_csum as u16,': 'low_u16(u64::from(bitmap_csum)),',
            '(bitmap_csum >> 16) as u16,': 'u16::try_from(bitmap_csum >> 16).map_err(|_| Ext4Error::ArithmeticOverflow)?,',
            'write_u16(&mut group.descriptor, GD_CHECKSUM, descriptor_csum as u16)?;': 'write_u16(\n        &mut group.descriptor,\n        GD_CHECKSUM,\n        low_u16(u64::from(descriptor_csum)),\n    )?;',
            'if provided != checksum as u16 {': 'if provided != low_u16(u64::from(checksum)) {',
            'write_u16(root, last_offset + 4, (last_len + 1) as u16)?;': 'write_u16(\n            root,\n            last_offset + 4,\n            u16::try_from(last_len + 1).map_err(|_| Ext4Error::ArithmeticOverflow)?,\n        )?;',
            'write_u16(root, new_offset + 6, (allocated_block >> 32) as u16)?;': 'write_u16(\n        root,\n        new_offset + 6,\n        u16::try_from(allocated_block >> 32).map_err(|_| Ext4Error::ArithmeticOverflow)?,\n    )?;',
            'write_u32(root, new_offset + 8, allocated_block as u32)?;': 'write_u32(root, new_offset + 8, low_u32(allocated_block))?;',
            'write_u32(bytes, low_offset, value as u32)?;': 'write_u32(bytes, low_offset, low_u32(value))?;',
            'write_u32(bytes, high_offset, (value >> 32) as u32)': 'write_u32(\n        bytes,\n        high_offset,\n        u32::try_from(value >> 32).map_err(|_| Ext4Error::ArithmeticOverflow)?,\n    )',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected text not found: {old!r}')
              s = s.replace(old, new, 1)

          marker = 'fn write_u16(bytes: &mut [u8], offset: usize, value: u16) -> Result<(), Ext4Error> {'
          helpers = '''fn low_u16(value: u64) -> u16 {\n    let bytes = value.to_le_bytes();\n    u16::from_le_bytes([bytes[0], bytes[1]])\n}\n\nfn low_u32(value: u64) -> u32 {\n    let bytes = value.to_le_bytes();\n    u32::from_le_bytes([bytes[0], bytes[1], bytes[2], bytes[3]])\n}\n\n'''
          if helpers not in s:
              if marker not in s:
                  raise SystemExit('write_u16 marker not found')
              s = s.replace(marker, helpers + marker, 1)

          p.write_text(s)
          PY

      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-ext4/src/allocate.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor(ext4): make Stage 3 narrowing explicit'
          git push origin HEAD:feat/stage3-ext4-block-allocation
