name: stage4-quality-fix

on:
  push:
    branches:
      - feat/stage4-ext4-create-file

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage4-ext4-create-file
      - name: Apply exact quality fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/loom-ext4/src/create.rs')
          s = p.read_text()
          changes = [
              ("const EXTENT_ENTRY_SIZE: usize = 12;\n", ""),
              ("    inode_table_block: u64,\n", ""),
              ("            inode_table_block,\n", ""),
              ("        .last()\n        .ok_or(Ext4Error::InvalidPath(\"missing filename\"))?\n", "        .last()\n        .copied()\n        .ok_or(Ext4Error::InvalidPath(\"missing filename\"))?\n"),
              ("        || read_u16(block, tail + DIRENT_TAIL_REC_LEN)? != DIRENT_TAIL_SIZE as u16\n", "        || read_u16(block, tail + DIRENT_TAIL_REC_LEN)?\n            != u16::try_from(DIRENT_TAIL_SIZE).map_err(|_| Ext4Error::ArithmeticOverflow)?\n"),
              ("        if self.resolve_path(target_path).is_ok() {\n            return Err(Ext4Error::InvalidPath(\"target path already exists\"));\n        }\n", "        match self.resolve_path(target_path) {\n            Ok(_) => return Err(Ext4Error::InvalidPath(\"target path already exists\")),\n            Err(Ext4Error::PathNotFound(_)) => {}\n            Err(error) => return Err(error),\n        }\n"),
          ]
          for old, new in changes:
              if old not in s:
                  raise SystemExit('expected source fragment not found: ' + repr(old))
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-ext4/src/create.rs
          git commit -m 'refactor(ext4): tighten Stage 4 create transaction'
          git push origin HEAD:feat/stage4-ext4-create-file
