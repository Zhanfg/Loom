name: stage8-reader-refactor

on:
  push:
    branches:
      - feat/stage8-sparse-overlay-workspace

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage8-sparse-overlay-workspace
      - name: Apply source refactor
        run: python3 scripts/stage8_reader_refactor_v2.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-ext4/src
          git commit -m 'refactor(ext4): accept virtual image readers'
          git push origin HEAD:feat/stage8-sparse-overlay-workspace
