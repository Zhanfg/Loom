name: stage31-plain-data-maintenance-retry

on:
  push:
    branches:
      - feat/stage31-erofs-legacy-full-plain-data
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply aligned PLAIN data-head support
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage31_plain_data_fix.py
          python3 .github/stage31_clippy_refactor.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          rm -f .github/stage31_plain_data_fix.py .github/stage31_clippy_refactor.py
          rm -f tests/integration/stage31_probe_legacy_full_plain.sh
          git checkout fa6edf5036e272ed8e13cdc7887280de57a45d99 -- .github/workflows/linux-hard-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/loom-erofs/src/compact_core.rs tests/integration .github
          git commit -m 'feat(erofs): support aligned full-index PLAIN data heads'
          git push origin HEAD:feat/stage31-erofs-legacy-full-plain-data
