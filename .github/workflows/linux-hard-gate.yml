name: stage42-partial-fragment-probe

on:
  push:
    branches:
      - feat/stage42-erofs-partial-fragment-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install EROFS tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils util-linux python3
          sudo modprobe erofs || true
      - name: Probe real partial fragment topology
        run: bash tests/integration/stage42_probe_erofs_partial_fragment.sh
