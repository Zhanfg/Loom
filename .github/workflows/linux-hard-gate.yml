name: stage32-error-contract-maintenance

on:
  push:
    branches:
      - feat/stage32-erofs-legacy-full-plain-partial-tail
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve Stage 30 error contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage32_error_contract_fix.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          rm -f .github/stage32_error_contract_fix.py
          git checkout a55f7cfd07c27d92812cc840f5235707e72a7fd4 -- .github/workflows/linux-hard-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/loom-erofs/src/compact_core.rs tests/integration/stage32_erofs_legacy_full_plain_partial_tail.sh .github
          git commit -m 'fix(erofs): preserve partial-tail rejection contract'
          git push origin HEAD:feat/stage32-erofs-legacy-full-plain-partial-tail
