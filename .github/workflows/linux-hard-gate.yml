name: stage37-legacy-full-big-multiblock-plain-partial-diagnostic

on:
  push:
    branches:
      - feat/stage37-erofs-legacy-full-big-multiblock-plain-partial
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Probe multiblock LZ4 plus partial PLAIN tail
        run: bash tests/integration/stage37_probe_legacy_full_big_multiblock_plain_partial.sh
