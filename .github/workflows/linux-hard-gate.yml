name: stage30-full-eof-sentinel-maintenance

on:
  push:
    branches:
      - feat/stage30-erofs-legacy-full-partial-tail
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply full-index EOF sentinel support
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage30_full_eof_sentinel_fix.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          rm -f .github/stage30_full_eof_sentinel_fix.py
          git checkout 234766057c4e8b585b20f7290780276efcc613dc -- .github/workflows/linux-hard-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/loom-erofs/src/compact_core.rs .github
          git commit -m 'feat(erofs): accept legacy full-index EOF sentinel'
          git push origin HEAD:feat/stage30-erofs-legacy-full-partial-tail
