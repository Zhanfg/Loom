name: stage32-plain-partial-maintenance

on:
  push:
    branches:
      - feat/stage32-erofs-legacy-full-plain-partial-tail
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply partial PLAIN raw-tail support
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage32_plain_partial_fix.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          rm -f .github/stage32_plain_partial_fix.py
          rm -f tests/integration/stage32_probe_legacy_full_plain_partial_tail.sh
          git checkout 1b07280d6068d089f81c232721fb7d7d7127f52a -- .github/workflows/linux-hard-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/loom-erofs/src/compact_core.rs tests/integration .github
          git commit -m 'feat(erofs): support partial full-index PLAIN raw tails'
          git push origin HEAD:feat/stage32-erofs-legacy-full-plain-partial-tail
