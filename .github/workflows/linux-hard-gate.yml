name: stage29-clippy-maintenance

on:
  push:
    branches:
      - feat/stage29-erofs-legacy-full-index
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refactor full-index validation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage29_clippy_fix.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          rm -f .github/stage29_clippy_fix.py
          git checkout HEAD^ -- .github/workflows/linux-hard-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/loom-erofs/src/compact_core.rs .github
          git commit -m 'refactor(erofs): isolate full-index delta validation'
          git push origin HEAD:feat/stage29-erofs-legacy-full-index
