name: stage29-full-index-maintenance

on:
  push:
    branches:
      - feat/stage29-erofs-legacy-full-index
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply verified Stage 29 parser patch
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/stage29-full-index-patch.yml \
            | sed '1d;$d;s/^          //' > /tmp/stage29_patch.py
          python3 /tmp/stage29_patch.py
          cargo fmt --all
          cargo check --workspace
          rm -f .github/workflows/stage29-full-index-diagnostic.yml
          rm -f .github/workflows/stage29-full-index-patch.yml
          git checkout HEAD^ -- .github/workflows/linux-hard-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/loom-erofs/src/compact_core.rs .github/workflows
          git commit -m 'feat(erofs): parse ordinary legacy full indexes'
          git push origin HEAD:feat/stage29-erofs-legacy-full-index
