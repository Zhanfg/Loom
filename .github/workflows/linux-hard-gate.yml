name: stage36-legacy-full-big-plain-partial-diagnostic

on:
  push:
    branches:
      - feat/stage36-erofs-legacy-full-big-plain-partial-tail
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Probe legacy full-big partial PLAIN tail
        run: bash tests/integration/stage36_probe_legacy_full_big_plain_partial.sh
