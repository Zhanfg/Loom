name: stage39-fragments-probe

on:
  push:
    branches:
      - feat/stage39-erofs-fragments-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install EROFS tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils util-linux python3
          sudo modprobe loop || true
          sudo modprobe erofs || true
      - name: Probe real fragment topology
        run: bash tests/integration/stage39_probe_erofs_fragments.sh
