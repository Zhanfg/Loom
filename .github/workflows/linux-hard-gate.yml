name: stage29-compat-order-maintenance

on:
  push:
    branches:
      - feat/stage29-erofs-legacy-full-index
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply compatibility-order fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage29_compat_order_fix.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          rm -f .github/stage29_compat_order_fix.py
          git checkout b56416cffe04f96e758e451f49e802bc2fef1f18 -- .github/workflows/linux-hard-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/loom-erofs/src/compact_core.rs .github
          git commit -m 'fix(erofs): prioritize LZ4 placement compatibility'
          git push origin HEAD:feat/stage29-erofs-legacy-full-index
