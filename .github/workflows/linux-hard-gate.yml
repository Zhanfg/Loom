name: stage35-legacy-full-big-plain-diagnostic

on:
  push:
    branches:
      - feat/stage35-erofs-legacy-full-big-plain-data
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Probe PLAIN data inside legacy full-big
        run: bash tests/integration/stage35_probe_legacy_full_big_plain.sh
