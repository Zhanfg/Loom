name: stage38-legacy-full-inline-pcluster-diagnostic

on:
  push:
    branches:
      - feat/stage38-erofs-legacy-full-inline-pcluster
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Probe legacy full inline pcluster
        run: bash tests/integration/stage38_probe_legacy_full_inline_pcluster.sh
