name: stage43-shared-partial-overlay-maintenance

on:
  push:
    branches:
      - feat/stage43-erofs-shared-partial-fragment-probe
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and verify Stage 43 shared-partial overlay core
        run: |
          set -euo pipefail
          python3 tests/integration/apply_stage43_shared_partial_overlay.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

          rm tests/integration/apply_stage43_shared_partial_overlay.py
          rm tests/integration/stage43_probe_erofs_shared_partial_fragments.sh
          cat > .github/workflows/linux-hard-gate.yml <<'YAML'
          name: linux-hard-gate

          on:
            pull_request:
            workflow_dispatch:
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            linux-hard-gate:
              runs-on: ubuntu-24.04
              timeout-minutes: 45

              steps:
                - name: Checkout
                  uses: actions/checkout@v5

                - name: Install Rust
                  uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy

                - name: Install filesystem test dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y e2fsprogs erofs-utils dmsetup util-linux python3

                - name: Prepare host kernel facilities
                  run: |
                    sudo modprobe loop || true
                    sudo modprobe dm_mod || true
                    sudo modprobe erofs || true
                    sudo losetup -f
                    sudo dmsetup version

                - name: Run canonical Linux hard gate
                  run: bash tests/ci/linux-hard-gate.sh
          YAML

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/loom-erofs/src/compact_core.rs crates/loom-erofs/src/multi_lz4.rs .github/workflows/linux-hard-gate.yml
          git add -u tests/integration
          git diff --cached --check
          git commit -m 'feat(erofs): preserve neighboring shared partial fragments'
          git push origin HEAD:feat/stage43-erofs-shared-partial-fragment-probe
