name: stage32-plain-partial-diagnostic

on:
  push:
    branches:
      - feat/stage32-erofs-legacy-full-plain-partial-tail
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Probe incompressible partial EOF tail
        run: bash tests/integration/stage32_probe_legacy_full_plain_partial_tail.sh
