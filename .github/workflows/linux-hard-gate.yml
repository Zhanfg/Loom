name: stage34-full-big-partial-maintenance

on:
  push:
    branches:
      - feat/stage34-erofs-legacy-full-big-partial-tail
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply full-big EOF sentinel support
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage34_full_big_partial_fix.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          rm -f .github/stage34_full_big_partial_fix.py
          rm -f tests/integration/stage34_probe_legacy_full_big_partial.sh
          git checkout fecc9d9d949c67b6087a53b9684d3a3bede20f6b -- .github/workflows/linux-hard-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/loom-erofs/src/compact_core.rs tests/integration .github
          git commit -m 'feat(erofs): support legacy full-big partial EOF sentinels'
          git push origin HEAD:feat/stage34-erofs-legacy-full-big-partial-tail
