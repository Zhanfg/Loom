name: stage43-shared-partial-fragment-probe

on:
  push:
    branches:
      - feat/stage43-erofs-shared-partial-fragment-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install EROFS tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils util-linux python3
          sudo modprobe erofs || true
      - name: Probe shared partial fragment overlap
        run: bash tests/integration/stage43_probe_erofs_shared_partial_fragments.sh
