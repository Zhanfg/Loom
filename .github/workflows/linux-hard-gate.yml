name: stage43-native-diagnostic

on:
  push:
    branches:
      - diag/stage43-native-a6102f10

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install filesystem tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils dmsetup util-linux python3
          sudo modprobe loop || true
          sudo modprobe dm_mod || true
          sudo modprobe erofs || true
      - name: Run Stage 43 native proof only
        run: bash tests/integration/stage43_erofs_shared_partial_overlay.sh
