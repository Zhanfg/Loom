name: linux-hard-gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/stage27-erofs-partial-tail

permissions:
  contents: write

jobs:
  stage27-sentinel-patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/stage27-erofs-partial-tail'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage27-erofs-partial-tail
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rebuild Stage 27 compact core from validated Stage 26 baseline
        shell: bash
        run: |
          git checkout 6cefdb9a97862f72e18fe0c8072a010781228d2b -- crates/loom-erofs/src/compact_core.rs
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/loom-erofs/src/compact_core.rs')
          text = path.read_text()

          def block(lines):
              return '\n'.join(lines)

          def once(old, new):
              global text
              count = text.count(old)
              assert count == 1, (count, old[:180])
              text = text.replace(old, new, 1)

          # Compact type 0 is accepted only as the validated partial-EOF sentinel.
          once(
              block(['const MAP_HEADER_SIZE: u64 = 8;', 'const LCLUSTER_HEAD1: u16 = 1;']),
              block(['const MAP_HEADER_SIZE: u64 = 8;', 'const LCLUSTER_PLAIN: u16 = 0;', 'const LCLUSTER_HEAD1: u16 = 1;']),
          )

          once(
              block([
                  '    compact_2b_entries: usize,',
                  '    heads: Vec<Head>,',
              ]),
              block([
                  '    compact_2b_entries: usize,',
                  '    eof_plain_clusterofs: Option<usize>,',
                  '    heads: Vec<Head>,',
              ]),
          )

          # Ordinary self-encode: real data HEADs remain block-aligned; only the final
          # logical extent terminates at exact EOF rather than ceil(i_size/4096)*4096.
          once(
              block([
                  '        let next_lcn = topology',
                  '            .heads',
                  '            .get(index + 1)',
                  '            .map_or(topology.logical_lclusters, |next| next.lcn);',
                  '        let start = head',
                  '            .lcn',
                  '            .checked_mul(BLOCK_BYTES)',
                  '            .ok_or(CoreError::ArithmeticOverflow)?;',
                  '        let end = next_lcn',
                  '            .checked_mul(BLOCK_BYTES)',
                  '            .ok_or(CoreError::ArithmeticOverflow)?;',
                  '        let extent = replacement',
                  '            .get(start..end)',
                  '            .ok_or(CoreError::InvalidFilesystem(',
                  '                "recovered logical extent lies beyond replacement payload",',
                  '            ))?;',
              ]),
              block([
                  '        let start = head',
                  '            .lcn',
                  '            .checked_mul(BLOCK_BYTES)',
                  '            .ok_or(CoreError::ArithmeticOverflow)?;',
                  '        let end = if let Some(next) = topology.heads.get(index + 1) {',
                  '            next.lcn',
                  '                .checked_mul(BLOCK_BYTES)',
                  '                .ok_or(CoreError::ArithmeticOverflow)?',
                  '        } else {',
                  '            replacement.len()',
                  '        };',
                  '        if start >= end || end > replacement.len() {',
                  '            return Err(CoreError::InvalidFilesystem(',
                  '                "recovered logical extent lies beyond replacement payload",',
                  '            ));',
                  '        }',
                  '        let extent = replacement',
                  '            .get(start..end)',
                  '            .ok_or(CoreError::UnexpectedEndOfStructure)?;',
              ]),
          )

          # Big self-encode gets the same exact-EOF bound while keeping its existing
          # lcluster-aligned extent starts and CBLKCNT capacities.
          once(
              block([
                  '        let next_lcn = topology',
                  '            .extents',
                  '            .get(index + 1)',
                  '            .map_or(topology.logical_lclusters, |next| next.lcn);',
                  '        let start = extent',
                  '            .lcn',
                  '            .checked_mul(BLOCK_BYTES)',
                  '            .ok_or(CoreError::ArithmeticOverflow)?;',
                  '        let end = next_lcn',
                  '            .checked_mul(BLOCK_BYTES)',
                  '            .ok_or(CoreError::ArithmeticOverflow)?;',
                  '        let logical_extent = replacement',
                  '            .get(start..end)',
                  '            .ok_or(CoreError::InvalidFilesystem(',
                  '                "recovered big logical extent lies beyond replacement payload",',
                  '            ))?;',
              ]),
              block([
                  '        let start = extent',
                  '            .lcn',
                  '            .checked_mul(BLOCK_BYTES)',
                  '            .ok_or(CoreError::ArithmeticOverflow)?;',
                  '        let end = if let Some(next) = topology.extents.get(index + 1) {',
                  '            next.lcn',
                  '                .checked_mul(BLOCK_BYTES)',
                  '                .ok_or(CoreError::ArithmeticOverflow)?',
                  '        } else {',
                  '            replacement.len()',
                  '        };',
                  '        if start >= end || end > replacement.len() {',
                  '            return Err(CoreError::InvalidFilesystem(',
                  '                "recovered big logical extent lies beyond replacement payload",',
                  '            ));',
                  '        }',
                  '        let logical_extent = replacement',
                  '            .get(start..end)',
                  '            .ok_or(CoreError::UnexpectedEndOfStructure)?;',
              ]),
          )

          # Partial logical files still have a ceil-sized compact index vector.
          once(
              block([
                  '    if inode.size < u64::from(BLOCK_SIZE) * 2 || inode.size % u64::from(BLOCK_SIZE) != 0 {',
                  '        return Err(CoreError::UnsupportedInode(',
                  '            "compact core requires a whole-block file of at least two lclusters",',
                  '        ));',
                  '    }',
                  '    usize::try_from(inode.size / u64::from(BLOCK_SIZE)).map_err(|_| CoreError::ArithmeticOverflow)',
              ]),
              block([
                  '    let logical_lclusters = div_ceil(inode.size, u64::from(BLOCK_SIZE))?;',
                  '    if logical_lclusters < 2 {',
                  '        return Err(CoreError::UnsupportedInode(',
                  '            "compact core requires at least two logical clusters",',
                  '        ));',
                  '    }',
                  '    usize::try_from(logical_lclusters).map_err(|_| CoreError::ArithmeticOverflow)',
              ]),
          )

          # The final PLAIN record of a partial ordinary file is an EOF boundary marker,
          # not a data HEAD. Validate it first, then recover only physical HEAD1 extents.
          once(
              block([
                  '        let entries = self.read_all_entries(map.ebase, logical_lclusters)?;',
                  '        let heads = self.recover_heads(map.ebase, logical_lclusters, &entries)?;',
                  '        if heads.len() != compressed_blocks {',
                  '            return Err(CoreError::InvalidFilesystem(',
                  '                "compressed block count does not match recovered HEAD count",',
                  '            ));',
                  '        }',
                  '        validate_nonheads(&entries, &heads, logical_lclusters)?;',
                  '        validate_head_blocks(&heads, self.bytes)?;',
                  '',
                  '        Ok(Topology {',
                  '            nid,',
                  '            logical_size: inode.size,',
                  '            algorithm: map.algorithm,',
                  '            advise: map.advise,',
                  '            logical_lclusters,',
                  '            compact_2b_entries: map.regions.compact_2b,',
                  '            heads,',
                  '        })',
              ]),
              block([
                  '        let entries = self.read_all_entries(map.ebase, logical_lclusters)?;',
                  '        let eof_plain_clusterofs =',
                  '            validate_eof_plain_sentinel(&entries, logical_lclusters, inode.size)?;',
                  '        let heads = self.recover_heads(',
                  '            map.ebase,',
                  '            logical_lclusters,',
                  '            &entries,',
                  '            eof_plain_clusterofs,',
                  '        )?;',
                  '        if heads.len() != compressed_blocks {',
                  '            return Err(CoreError::InvalidFilesystem(',
                  '                "compressed block count does not match recovered HEAD count",',
                  '            ));',
                  '        }',
                  '        validate_nonheads(',
                  '            &entries,',
                  '            &heads,',
                  '            logical_lclusters,',
                  '            eof_plain_clusterofs,',
                  '        )?;',
                  '        validate_head_blocks(&heads, self.bytes)?;',
                  '',
                  '        Ok(Topology {',
                  '            nid,',
                  '            logical_size: inode.size,',
                  '            algorithm: map.algorithm,',
                  '            advise: map.advise,',
                  '            logical_lclusters,',
                  '            compact_2b_entries: map.regions.compact_2b,',
                  '            eof_plain_clusterofs,',
                  '            heads,',
                  '        })',
              ]),
          )

          once(
              block([
                  '    fn recover_heads(',
                  '        &mut self,',
                  '        ebase: u64,',
                  '        total: usize,',
                  '        entries: &[CompactEntry],',
                  '    ) -> Result<Vec<Head>, CoreError> {',
              ]),
              block([
                  '    fn recover_heads(',
                  '        &mut self,',
                  '        ebase: u64,',
                  '        total: usize,',
                  '        entries: &[CompactEntry],',
                  '        eof_plain_clusterofs: Option<usize>,',
                  '    ) -> Result<Vec<Head>, CoreError> {',
              ]),
          )
          once(
              block([
                  '                LCLUSTER_NONHEAD => {}',
                  '                _ => {',
                  '                    return Err(CoreError::UnsupportedInode(',
                  '                        "compact core supports only HEAD1 and NONHEAD entries",',
                  '                    ))',
                  '                }',
              ]),
              block([
                  '                LCLUSTER_PLAIN => {',
                  '                    let expected = eof_plain_clusterofs.ok_or(',
                  '                        CoreError::UnsupportedInode(',
                  '                            "ordinary compact PLAIN is supported only as a partial-EOF sentinel",',
                  '                        ),',
                  '                    )?;',
                  '                    if lcn + 1 != total || usize::from(entry.low) != expected {',
                  '                        return Err(CoreError::InvalidFilesystem(',
                  '                            "ordinary compact PLAIN does not match the validated EOF sentinel",',
                  '                        ));',
                  '                    }',
                  '                }',
                  '                LCLUSTER_NONHEAD => {}',
                  '                _ => {',
                  '                    return Err(CoreError::UnsupportedInode(',
                  '                        "compact core supports only HEAD1, NONHEAD, and a partial-EOF PLAIN sentinel",',
                  '                    ))',
                  '                }',
              ]),
          )

          # Compatibility must preserve the sentinel boundary as well as real HEAD layout.
          once(
              block([
                  '    if origin.logical_lclusters != replacement.logical_lclusters {',
                  '        return Err(CoreError::IncompatibleReplacement(',
                  '            "logical compact-index lengths differ",',
                  '        ));',
                  '    }',
                  '    if origin.heads.len() != replacement.heads.len() {',
              ]),
              block([
                  '    if origin.logical_lclusters != replacement.logical_lclusters {',
                  '        return Err(CoreError::IncompatibleReplacement(',
                  '            "logical compact-index lengths differ",',
                  '        ));',
                  '    }',
                  '    if origin.eof_plain_clusterofs != replacement.eof_plain_clusterofs {',
                  '        return Err(CoreError::IncompatibleReplacement(',
                  '            "partial-EOF PLAIN sentinel offsets differ",',
                  '        ));',
                  '    }',
                  '    if origin.heads.len() != replacement.heads.len() {',
              ]),
          )

          # Sentinel validator plus NONHEAD validation that excludes the sentinel index itself.
          marker = block([
              'fn validate_nonheads(',
              '    entries: &[CompactEntry],',
              '    heads: &[Head],',
              '    total: usize,',
              ') -> Result<(), CoreError> {',
          ])
          replacement = block([
              'fn validate_eof_plain_sentinel(',
              '    entries: &[CompactEntry],',
              '    total: usize,',
              '    logical_size: u64,',
              ') -> Result<Option<usize>, CoreError> {',
              '    if entries.len() != total || total == 0 {',
              '        return Err(CoreError::InvalidFilesystem(',
              '            "compact index vector length differs from logical lcluster count",',
              '        ));',
              '    }',
              '    let remainder = usize::try_from(logical_size % u64::from(BLOCK_SIZE))',
              '        .map_err(|_| CoreError::ArithmeticOverflow)?;',
              '    if remainder == 0 {',
              '        return Ok(None);',
              '    }',
              '    let eof = entries.last().ok_or(CoreError::UnexpectedEndOfStructure)?;',
              '    if eof.kind != LCLUSTER_PLAIN || usize::from(eof.low) != remainder {',
              '        return Err(CoreError::InvalidFilesystem(',
              '            "partial ordinary compact file lacks the expected PLAIN EOF sentinel",',
              '        ));',
              '    }',
              '    Ok(Some(remainder))',
              '}',
              '',
              'fn validate_nonheads(',
              '    entries: &[CompactEntry],',
              '    heads: &[Head],',
              '    total: usize,',
              '    eof_plain_clusterofs: Option<usize>,',
              ') -> Result<(), CoreError> {',
          ])
          once(marker, replacement)

          once(
              '        let next_head = heads.get(head_index + 1).map_or(total, |next| next.lcn);',
              block([
                  '        let next_head = heads.get(head_index + 1).map_or_else(',
                  '            || {',
                  '                if eof_plain_clusterofs.is_some() {',
                  '                    total.saturating_sub(1)',
                  '                } else {',
                  '                    total',
                  '                }',
                  '            },',
                  '            |next| next.lcn,',
                  '        );',
              ]),
          )

          # Existing topology unit fixture gets explicit no-sentinel metadata.
          once(
              block([
                  '            compact_2b_entries: 0,',
                  '            heads: vec![Head {',
              ]),
              block([
                  '            compact_2b_entries: 0,',
                  '            eof_plain_clusterofs: None,',
                  '            heads: vec![Head {',
              ]),
          )

          test_marker = block([
              '    #[test]',
              '    fn later_extent_codec_failure_happens_before_view_construction() {',
          ])
          sentinel_test = block([
              '    #[test]',
              '    fn partial_eof_plain_is_a_sentinel_not_a_data_head() {',
              '        let mut entries = vec![',
              '            CompactEntry {',
              '                kind: LCLUSTER_HEAD1,',
              '                low: 0,',
              '                slot: 0,',
              '                slots: 2,',
              '                base_pblk: 10,',
              '            },',
              '            CompactEntry {',
              '                kind: LCLUSTER_PLAIN,',
              '                low: 3973,',
              '                slot: 1,',
              '                slots: 2,',
              '                base_pblk: 10,',
              '            },',
              '        ];',
              '        assert_eq!(',
              '            validate_eof_plain_sentinel(&entries, 2, 4096 + 3973).unwrap(),',
              '            Some(3973)',
              '        );',
              '        entries[1].low = 3972;',
              '        assert!(matches!(',
              '            validate_eof_plain_sentinel(&entries, 2, 4096 + 3973),',
              '            Err(CoreError::InvalidFilesystem(',
              '                "partial ordinary compact file lacks the expected PLAIN EOF sentinel"',
              '            ))',
              '        ));',
              '    }',
              '',
          ])
          assert text.count(test_marker) == 1
          text = text.replace(test_marker, sentinel_test + test_marker, 1)

          path.write_text(text)
          PY
          cargo fmt --all
          grep -q 'eof_plain_clusterofs' crates/loom-erofs/src/compact_core.rs
          grep -q 'partial_eof_plain_is_a_sentinel_not_a_data_head' crates/loom-erofs/src/compact_core.rs
          ! grep -q 'head_cluster_offsets' crates/loom-erofs/src/compact_core.rs
          ! grep -q 'encode_plain_extent' crates/loom-erofs/src/compact_core.rs
      - name: Commit rebuilt core and restore canonical workflow
        shell: bash
        run: |
          git config user.name 'Loom Stage 27 maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git checkout 89fc8afb058a23d58b17809d0ee5b0c7aa1c046b -- .github/workflows/linux-hard-gate.yml
          git add crates/loom-erofs/src/compact_core.rs .github/workflows/linux-hard-gate.yml
          git commit -m 'stage27: treat partial PLAIN index as EOF sentinel'
          git push origin HEAD:feat/stage27-erofs-partial-tail

  linux-hard-gate:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install filesystem test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs erofs-utils dmsetup util-linux python3
      - name: Prepare host kernel facilities
        run: |
          sudo modprobe loop || true
          sudo modprobe dm_mod || true
          sudo modprobe erofs || true
          sudo losetup -f
          sudo dmsetup version
      - name: Run canonical Linux hard gate
        run: bash tests/ci/linux-hard-gate.sh
