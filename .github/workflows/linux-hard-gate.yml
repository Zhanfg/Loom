name: stage31-plain-data-diagnostic

on:
  push:
    branches:
      - feat/stage31-erofs-legacy-full-plain-data
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Probe mixed legacy full-index topology
        run: bash tests/integration/stage31_probe_legacy_full_plain.sh
