name: stage39-legacy-full-big-inline-diagnostic

on:
  push:
    branches:
      - feat/stage39-erofs-legacy-full-big-inline-pcluster
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Probe legacy full-big inline pcluster
        run: bash tests/integration/stage39_probe_legacy_full_big_inline.sh
