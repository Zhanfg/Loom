name: stage33-legacy-full-big-diagnostic

on:
  push:
    branches:
      - feat/stage33-erofs-legacy-full-big-pcluster
    paths:
      - .github/workflows/linux-hard-gate.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Probe legacy full-index big pclusters
        run: bash tests/integration/stage33_probe_legacy_full_big.sh
