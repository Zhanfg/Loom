name: stage4-ownership-fix

on:
  push:
    branches:
      - feat/stage4-ext4-create-file

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage4-ext4-create-file
      - name: Apply ownership fix
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('crates/loom-ext4/src/create.rs')
          s = p.read_text()
          marker = '        Ok(GroupState {\n'
          prefix = (
              '        let free_blocks = descriptor_u32_count(&descriptor, GD_FREE_BLOCKS_LO, GD_FREE_BLOCKS_HI)?;\n'
              '        let free_inodes = descriptor_u32_count(&descriptor, GD_FREE_INODES_LO, GD_FREE_INODES_HI)?;\n'
              '        let itable_unused = descriptor_u32_count(&descriptor, GD_ITABLE_UNUSED_LO, GD_ITABLE_UNUSED_HI)?;\n\n'
          )
          if prefix not in s:
              if marker not in s:
                  raise SystemExit('GroupState constructor marker not found')
              s = s.replace(marker, prefix + marker, 1)
          s, n1 = re.subn(r'            free_blocks: descriptor_u32_count\(&descriptor, GD_FREE_BLOCKS_LO, GD_FREE_BLOCKS_HI\)\?,\n', '            free_blocks,\n', s, count=1)
          s, n2 = re.subn(r'            free_inodes: descriptor_u32_count\(&descriptor, GD_FREE_INODES_LO, GD_FREE_INODES_HI\)\?,\n', '            free_inodes,\n', s, count=1)
          s, n3 = re.subn(r'            itable_unused: descriptor_u32_count\(\n                &descriptor,\n                GD_ITABLE_UNUSED_LO,\n                GD_ITABLE_UNUSED_HI,\n            \)\?,\n', '            itable_unused,\n', s, count=1)
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f'field rewrite mismatch: {(n1, n2, n3)}')
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-ext4/src/create.rs
          git commit -m 'fix(ext4): compute Stage 4 descriptor counts before move'
          git push origin HEAD:feat/stage4-ext4-create-file
