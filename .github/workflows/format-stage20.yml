name: format-stage20

on:
  push:
    branches:
      - feat/stage20-erofs-big-pcluster-self-encode

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage20-erofs-big-pcluster-self-encode
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: apply rustfmt through Stage 20'
          git push origin HEAD:feat/stage20-erofs-big-pcluster-self-encode
