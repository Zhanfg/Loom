name: stage4-typefix

on:
  push:
    branches:
      - feat/stage4-ext4-create-file

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage4-ext4-create-file
      - name: Apply exact type fix
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('crates/loom-ext4/src/create.rs')
          s = p.read_text()
          pattern = r'let descriptor_start_block\s*=\s*if self\.superblock\.block_size == 1024'
          replacement = 'let descriptor_start_block: u64 = if self.superblock.block_size == 1024'
          s2, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'expected one descriptor_start_block binding, found {count}')
          p.write_text(s2)
          PY
          cargo fmt --all
      - name: Commit exact fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/loom-ext4/src/create.rs
          git commit -m 'fix(ext4): type Stage 4 descriptor block arithmetic'
          git push origin HEAD:feat/stage4-ext4-create-file
