name: Bootstrap and Build AXYMORSEN Signer

on:
  push:
    branches:
      - feat/axymorrsen-signer-flutter
  pull_request:
    branches:
      - feat/axymorrsen-signer-flutter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signer-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          cat .bootstrap/source.b64.* | base64 --decode > /tmp/axymorrsen-signer-source.tar.gz
          gzip -t /tmp/axymorrsen-signer-source.tar.gz
          tar -xzf /tmp/axymorrsen-signer-source.tar.gz

      - name: Modernize Flutter stable APIs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("lib/features/home/home_screen.dart")
          s = p.read_text()

          old_dropdown = """                  DropdownButtonFormField<String>(
                    value: _selectedKeyId,
                    decoration: const InputDecoration(labelText: 'Signing key'),
                    items: _keys
                        .map((key) => DropdownMenuItem(value: key.id, child: Text('${key.alias} · ${key.sha256.substring(0, 17)}…')))
                        .toList(growable: false),
                    onChanged: _busy ? null : (value) => setState(() => _selectedKeyId = value),
                  ),
          """
          new_dropdown = """                  InputDecorator(
                    decoration: const InputDecoration(labelText: 'Signing key'),
                    child: DropdownButtonHideUnderline(
                      child: DropdownButton<String>(
                        isExpanded: true,
                        value: _selectedKeyId,
                        items: _keys
                            .map((key) => DropdownMenuItem(
                                  value: key.id,
                                  child: Text('${key.alias} · ${key.sha256.substring(0, 17)}…'),
                                ))
                            .toList(growable: false),
                        onChanged: _busy ? null : (value) => setState(() => _selectedKeyId = value),
                      ),
                    ),
                  ),
          """

          old_radios = """                  for (final key in _keys)
                    RadioListTile<String>(
                      value: key.id,
                      groupValue: _selectedKeyId,
                      onChanged: _busy ? null : (value) => setState(() => _selectedKeyId = value),
                      title: Text(key.alias),
                      subtitle: Text('CN=${key.commonName}\\n${key.sha256}'),
                    ),
          """
          new_radios = """                  RadioGroup<String>(
                    groupValue: _selectedKeyId,
                    onChanged: (value) {
                      if (_busy) return;
                      setState(() => _selectedKeyId = value);
                    },
                    child: Column(
                      children: [
                        for (final key in _keys)
                          RadioListTile<String>(
                            value: key.id,
                            enabled: !_busy,
                            title: Text(key.alias),
                            subtitle: Text('CN=${key.commonName}\\n${key.sha256}'),
                          ),
                      ],
                    ),
                  ),
          """

          if old_dropdown not in s:
              raise SystemExit("dropdown patch anchor not found")
          if old_radios not in s:
              raise SystemExit("radio patch anchor not found")
          s = s.replace(old_dropdown, new_dropdown).replace(old_radios, new_radios)
          p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        shell: bash
        run: |
          rm -rf /tmp/axymorrsen_signer_scaffold android
          flutter create             --platforms=android             --org io.axymorrsen             --project-name axymorrsen_signer             /tmp/axymorrsen_signer_scaffold
          cp -R /tmp/axymorrsen_signer_scaffold/android ./android
          ./tool/bootstrap_android.sh

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AXYMORSEN-Signer-1.0.0.apk
          sha256sum dist/AXYMORSEN-Signer-1.0.0.apk | tee dist/AXYMORSEN-Signer-1.0.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AXYMORSEN-Signer-1.0.0-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Materialize source tree
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f axymorrsen-signer-source.tar.gz .bootstrap-trigger .ci-pr-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: materialize Flutter signer source tree"
            git push origin HEAD:feat/axymorrsen-signer-flutter
          fi
