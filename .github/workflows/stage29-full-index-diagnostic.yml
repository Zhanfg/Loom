name: stage29-full-index-diagnostic

on:
  push:
    branches:
      - feat/stage29-erofs-legacy-full-index
    paths:
      - .github/workflows/stage29-full-index-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Build legacy image
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/stage29"
          ROOT="$WORK/root"
          IMG="$WORK/legacy.erofs"
          rm -rf "$WORK"
          mkdir -p "$ROOT"
          python3 - "$ROOT/000payload.bin" <<'PY'
          import random, sys
          size = 98304
          period = 10000
          rng = random.Random(0x290001)
          p = bytes(rng.randrange(256) for _ in range(period))
          data = bytearray((p * ((size + period - 1)//period))[:size])
          marker = b'LOOM-STAGE29-LEGACY'
          data[64:64+len(marker)] = marker
          open(sys.argv[1], 'wb').write(data)
          PY
          for i in $(seq -w 0 499); do : > "$ROOT/z_dummy_${i}_for_directory_growth"; done
          mkfs.erofs -b 4096 -C 4096 -zlz4 -E legacy-compress,noinline_data -T 0 --max-extent-bytes 32768 "$IMG" "$ROOT"
          fsck.erofs "$IMG"
      - name: Dump official extent mapping
        run: dump.erofs -e --path=/000payload.bin "$RUNNER_TEMP/stage29/legacy.erofs"
      - name: Dump raw full indexes
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/stage29/legacy.erofs" <<'PY'
          import stat, struct, sys
          raw = open(sys.argv[1], 'rb').read()
          sb = 1024
          assert struct.unpack_from('<I', raw, sb)[0] == 0xE0F5E1E2
          meta = struct.unpack_from('<I', raw, sb + 0x28)[0]
          inos = struct.unpack_from('<Q', raw, sb + 0x10)[0]
          target = None
          for nid in range(int(inos) + 16):
              off = meta * 4096 + nid * 32
              if off + 32 > len(raw): break
              fmt = struct.unpack_from('<H', raw, off)[0]
              if fmt & ~0x1f: continue
              extended = fmt & 1
              layout = (fmt >> 1) & 7
              mode = struct.unpack_from('<H', raw, off + 4)[0]
              if stat.S_IFMT(mode) != stat.S_IFREG: continue
              if extended:
                  if off + 64 > len(raw): continue
                  size = struct.unpack_from('<Q', raw, off + 8)[0]
                  isize = 64
              else:
                  size = struct.unpack_from('<I', raw, off + 8)[0]
                  isize = 32
              if size == 98304 and layout == 4:
                  xcnt = struct.unpack_from('<H', raw, off + 2)[0]
                  xsize = 0 if xcnt == 0 else 12 + (xcnt - 1) * 4
                  data_word = struct.unpack_from('<I', raw, off + 0x10)[0]
                  target = (nid, off, layout, isize, xsize, size, data_word)
                  break
          assert target is not None, 'full-index target inode not found'
          nid, off, layout, isize, xsize, size, data_word = target
          header = (off + isize + xsize + 7) & ~7
          full_start = header + 16
          print(f'STAGE29_RAW nid={nid} inode_off={off} layout={layout} isize={isize} xattr={xsize} size={size} data_word={data_word} header={header} full_start={full_start}')
          print('STAGE29_HEADER', raw[header:header+16].hex())
          for lcn in range(24):
              p = full_start + lcn * 8
              advise, clusterofs, word = struct.unpack_from('<HHI', raw, p)
              d0, d1 = struct.unpack_from('<HH', raw, p + 4)
              print(f'STAGE29_IDX lcn={lcn} advise=0x{advise:04x} type={advise&3} clusterofs={clusterofs} word=0x{word:08x} delta0={d0} delta1={d1}')
          PY
