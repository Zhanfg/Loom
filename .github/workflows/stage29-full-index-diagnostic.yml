name: stage29-full-index-diagnostic

on:
  push:
    branches:
      - feat/stage29-erofs-legacy-full-index
    paths:
      - .github/workflows/stage29-full-index-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install erofs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils
      - name: Inspect legacy full-index image
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$(mktemp -d)"
          ROOT="$WORK/root"
          IMG="$WORK/legacy.erofs"
          mkdir -p "$ROOT"
          python3 - "$ROOT/000payload.bin" <<'PY'
          import random, sys
          size = 98304
          period = 10000
          rng = random.Random(0x290001)
          p = bytes(rng.randrange(256) for _ in range(period))
          data = bytearray((p * ((size + period - 1)//period))[:size])
          data[64:64+19] = b'LOOM-STAGE29-LEGACY'
          open(sys.argv[1], 'wb').write(data)
          PY
          for i in $(seq -w 0 499); do : > "$ROOT/z_dummy_${i}_for_directory_growth"; done
          mkfs.erofs -b 4096 -C 4096 -zlz4 -E legacy-compress,noinline_data -T 0 --max-extent-bytes 32768 "$IMG" "$ROOT"
          fsck.erofs "$IMG"
          dump.erofs -e --path=/000payload.bin "$IMG"
          python3 - "$IMG" <<'PY'
          import struct, sys
          raw = open(sys.argv[1], 'rb').read()
          sb = 1024
          root_nid = struct.unpack_from('<H', raw, sb + 0x0e)[0]
          meta = struct.unpack_from('<I', raw, sb + 0x28)[0]
          def inode(nid):
              off = meta*4096+nid*32
              fmt = struct.unpack_from('<H', raw, off)[0]
              ext = fmt & 1
              layout = (fmt >> 1) & 7
              isize = 64 if ext else 32
              xcnt = struct.unpack_from('<H', raw, off+2)[0]
              xsize = 0 if xcnt == 0 else 12+(xcnt-1)*4
              size = struct.unpack_from('<Q' if ext else '<I', raw, off+8)[0]
              data_word = struct.unpack_from('<I', raw, off+0x10)[0]
              return off, layout, isize, xsize, size, data_word
          roff, rlayout, risize, rxsize, rsize, rdata = inode(root_nid)
          # Parse first root directory block to resolve 000payload.bin nid.
          if rlayout == 0:
              blk = rdata
              block = raw[blk*4096:(blk+1)*4096]
          else:
              tail = roff+risize+rxsize
              block = raw[tail:tail+rsize]
          first_name = struct.unpack_from('<H', block, 8)[0]
          count = first_name//12
          target = None
          for i in range(count):
              e=i*12
              nid=struct.unpack_from('<Q', block, e)[0]
              noff=struct.unpack_from('<H', block, e+8)[0]
              nend=(struct.unpack_from('<H', block,e+20)[0] if i+1<count else len(block))
              name=block[noff:nend].split(b'\0',1)[0]
              if name==b'000payload.bin': target=nid
          assert target is not None
          off, layout, isize, xsize, size, blocks = inode(target)
          end=off+isize+xsize
          header=(end+7)&~7
          full_start=header+16
          print(f'STAGE29_RAW nid={target} inode_off={off} layout={layout} isize={isize} xattr={xsize} size={size} data_word={blocks} header={header} full_start={full_start}')
          print('STAGE29_HEADER', raw[header:header+16].hex())
          for lcn in range(min(8,(size+4095)//4096)):
              p=full_start+lcn*8
              advise, clusterofs, word=struct.unpack_from('<HHI', raw,p)
              print(f'STAGE29_IDX lcn={lcn} advise=0x{advise:04x} type={advise&3} clusterofs={clusterofs} word=0x{word:08x}')
          PY
