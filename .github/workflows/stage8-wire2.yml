name: stage8-wire2
on:
  push:
    branches:
      - feat/stage8-effective-block-store
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage8-effective-block-store
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire error propagation
        run: |
          sed -i '/Checksum(checksum::ChecksumError),/a\    View(loom_view::ViewError),' crates/loom-ext4/src/lib.rs
          sed -i '/Self::Checksum(error) => write!(f, "ext4 inode checksum error: {error}"),/a\            Self::View(error) => write!(f, "Loom effective-view error: {error}"),' crates/loom-ext4/src/lib.rs
          sed -i '/Self::Checksum(error) => Some(error),/a\            Self::View(error) => Some(error),' crates/loom-ext4/src/lib.rs
          cargo fmt --all
          cargo check --workspace
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/loom-ext4/src/lib.rs crates/loom-ext4/src/transaction.rs crates/loom-view
          git commit -m 'feat(view): integrate generic effective block store'
          git push origin HEAD:feat/stage8-effective-block-store
