version: 2.1

jobs:
  linux-filesystem-fabric:
    docker:
      - image: cimg/rust:1.97.1
    resource_class: large
    steps:
      - checkout

      - run:
          name: Install Linux test dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y e2fsprogs erofs-utils dmsetup util-linux kmod
            sudo modprobe dm_mod || true
            sudo modprobe dm_linear || true
            sudo modprobe erofs || true

      - run:
          name: Install Rust components
          command: |
            rustup component add rustfmt clippy

      - restore_cache:
          keys:
            - loom-cargo-v1-{{ checksum "Cargo.lock" }}
            - loom-cargo-v1-

      - run:
          name: Format
          command: cargo fmt --all -- --check

      - run:
          name: Clippy
          command: cargo clippy --workspace --all-targets -- -D warnings

      - run:
          name: Unit tests
          command: cargo test --workspace

      - run:
          name: Stage 8 effective block store
          command: cargo test -p loom-view --test effective_store

      - run:
          name: Stage 0 ext4 sparse substitution
          command: bash tests/integration/stage0_ext4_dm_linear.sh

      - run:
          name: Stage 1 ext4 path compiler
          command: bash tests/integration/stage1_ext4_compiler.sh

      - run:
          name: Stage 1 partial final block
          command: bash tests/integration/stage1_ext4_partial_block.sh

      - run:
          name: Stage 1.1 ext4 block-size matrix
          command: bash tests/integration/stage1_ext4_block_sizes.sh

      - run:
          name: Stage 1.1 sparse block delta
          command: bash tests/integration/stage1_ext4_block_delta.sh

      - run:
          name: Stage 1.1 sparse-file rejection
          command: bash tests/integration/stage1_ext4_sparse_reject.sh

      - run:
          name: Stage 2 inode resize
          command: bash tests/integration/stage2_ext4_inode_resize.sh

      - run:
          name: Stage 2 allocation-boundary rejection
          command: bash tests/integration/stage2_ext4_resize_reject.sh

      - run:
          name: Stage 2 block-size matrix
          command: bash tests/integration/stage2_ext4_block_sizes.sh

      - run:
          name: Stage 3 block allocation weaving
          command: bash tests/integration/stage3_ext4_block_allocation.sh

      - run:
          name: Stage 4 create-file weaving
          command: bash tests/integration/stage4_ext4_create_file.sh

      - run:
          name: Stage 5 remove-file weaving
          command: bash tests/integration/stage5_ext4_remove_file.sh

      - run:
          name: Stage 6 SELinux xattr weaving
          command: bash tests/integration/stage6_ext4_selinux_xattr.sh

      - run:
          name: Stage 7 effective-view transaction
          command: bash tests/integration/stage7_ext4_transaction_view.sh

      - run:
          name: Stage 9 EROFS flat-plain weaving
          command: bash tests/integration/stage9_erofs_flat_plain.sh

      - run:
          name: Stage 10 compressed EROFS pcluster swap
          command: bash tests/integration/stage10_erofs_compressed_pcluster.sh

      - save_cache:
          key: loom-cargo-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

workflows:
  hard-gate:
    jobs:
      - linux-filesystem-fabric
