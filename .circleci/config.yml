version: 2.1

jobs:
  linux-filesystem-fabric:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout

      - run:
          name: Prepare Linux filesystem test host
          command: |
            sudo apt-get update
            sudo apt-get install -y e2fsprogs erofs-utils dmsetup util-linux kmod curl python3
            sudo modprobe loop || true
            sudo modprobe dm_mod || true
            sudo modprobe dm_linear || true
            sudo modprobe erofs || true
            sudo losetup --find >/dev/null
            sudo dmsetup version

      - restore_cache:
          keys:
            - loom-cargo-v1-{{ checksum "Cargo.lock" }}
            - loom-cargo-v1-

      - run:
          name: Install Rust toolchain
          command: |
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
                sh -s -- -y --profile minimal --default-toolchain none
            fi
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
            rustc --version
            cargo --version

      - run:
          name: Linux filesystem hard gate
          command: |
            source "$BASH_ENV"
            bash tests/ci/linux-hard-gate.sh

      - save_cache:
          key: loom-cargo-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

workflows:
  hard-gate:
    jobs:
      - linux-filesystem-fabric
